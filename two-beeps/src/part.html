<!doctype html><html><head><meta charset="utf-8"><title>Two Beeps</title>
<style>
  @font-face{font-family:'Lilita One';font-weight:400;src:url(../assets/fonts/lilita-one-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:'Rubik';font-weight:500;src:url(../assets/fonts/rubik-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:'Rubik';font-weight:700;src:url(../assets/fonts/rubik-latin-700-normal.woff2) format('woff2')}
  html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto;max-height:100vh;object-fit:contain}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Tek bölüm sayfası: part.html?p=N (varsayılan 1). Sırayla yükler: cizim.js, motor.js, shots/pN-a.js, shots/pN-b.js
   (yoksa atlanır; Part 1'de eski adlar a-sahneler.js / b-sahneler.js), paket.js; sonra TB.boot('partN.timeline.json'). */
(function () {
  const N = +(new URLSearchParams(location.search).get('p') || 1);
  document.title = 'Two Beeps · Part ' + N;
  const ESKI = { 1: { a: 'shots/a-sahneler.js', b: 'shots/b-sahneler.js' } };
  const load = (src, opt) => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = () => ok(true); s.onerror = () => opt ? ok(false) : bad(new Error('yok: ' + src)); document.body.appendChild(s); });
  (async () => {
    await load('cizim.js'); await load('motor.js');
    for (const k of ['a', 'b']) if (!(await load(`shots/p${N}-${k}.js`, true)) && ESKI[N]) await load(ESKI[N][k], true);
    await load('paket.js');
    TB.boot(`part${N}.timeline.json`);
  })().catch(e => console.error(e));
})();
</script>
</body></html>
