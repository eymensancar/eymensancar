<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Burger Ustası</title><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Burger Ustası: YATAY dükkân oyunu (Eymen, 21 Kasım). #app ızgarası:
   üstte boydan boya ince üst bilgi (kasa, gün, gün çubuğu, canlar, ses, duraklat); solda sokak (tente, yan yana 3 müşteri, pervaz) ve altında tezgâh
   (ızgara, iki tabak, çöp); sağda malzeme tepsisi (15 kutu: 3 sütun × 5 satır). Telefon dik tutulursa "Telefonu yan çevir" ekranı (#cevir).
   Birim: 1rem = 10 birim; birim = min(güvenli yükseklik / 100, güvenli genişlik / 190). iPhone SE'den iPad'e ve bilgisayara aynı düzen
   boş kenar ya da taşma olmadan sığar. Güvenli alan --sl/--sr/--st/--sb (env(); denemede sabitlerle değiştirilir). Mantık js/oyun.js içinde. */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html{font-size:calc(10*min((100dvh - var(--st) - var(--sb))/100,(100vw - var(--sl) - var(--sr))/190));-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1a12;font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
body{font-size:.44rem}
:root{--ink:#2a1a10;--cream:#fff4dc;--red:#d2281e;--red-d:#8d140e;--gold:#ffc21a;--green:#2e9d3e;--good:#37c25a;--good2:#8bff6a;--bad:#ff5b4f;--sky1:#8fd3ff;--sky2:#d9f3ff}
#app{position:relative;width:100vw;height:100dvh;container-type:size;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;background:#8fd3ff;color:var(--ink);touch-action:none}
#app.sars{animation:sars .22s linear}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{display:block;width:100%;height:100%;flex:none;overflow:visible}
/* ---------- üst bilgi ---------- */
.hud{grid-area:1/1/2/3;position:relative;z-index:8;display:flex;align-items:center;gap:.12rem;padding:calc(var(--st) + .1rem) calc(var(--sr) + .16rem) .1rem calc(var(--sl) + .16rem)}
.chip{display:flex;align-items:center;gap:.1rem;background:rgba(255,255,255,.94);border:.05rem solid var(--ink);border-radius:.5rem;height:max(34px,.9rem);padding:0 .2rem 0 .08rem;font-weight:900;font-size:max(14px,.42rem);box-shadow:0 .07rem 0 rgba(0,0,0,.2);line-height:1;white-space:nowrap}
.chip .ic{width:max(24px,.64rem);height:max(24px,.64rem)}
.chip.kasa{min-width:min-content;flex:0 0 auto;font-variant-numeric:tabular-nums}
.chip.kasa.neg span{color:var(--red)}
.chip.kasa.pop{animation:kpop .3s ease-out}
.chip.kasa .i{transition:transform .12s}
.chip.kasa.tik .i{transform:scale(1.25) rotate(-12deg)}
.chip.gun{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 .2rem}
.canlar{display:flex;gap:.02rem;flex:none}
.canlar span{width:max(24px,.62rem);height:max(24px,.62rem);transition:transform .3s,opacity .3s}
.canlar span.bos{opacity:.55;transform:scale(.85)}
.canlar span.gitti{animation:cangit .7s ease-out}
.hb{position:relative;width:max(34px,.9rem);height:max(34px,.9rem);border-radius:50%;background:rgba(255,255,255,.94);border:.05rem solid var(--ink);box-shadow:0 .07rem 0 rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
#durBtn{margin-left:max(0px,calc(10px - .12rem))}
.hb .ic{width:62%;height:62%}
.hb:active{transform:translateY(.06rem);box-shadow:0 .02rem 0 rgba(0,0,0,.2)}
.hb::before,.home .lang::before{content:"";position:absolute;inset:min(0px,calc((max(34px,.9rem) - 44px)/2))}
.prog{position:relative;flex:1 1 auto;min-width:.6rem;margin:0 .1rem;height:max(10px,.3rem);border-radius:.2rem;background:#fff;border:.05rem solid var(--ink);box-shadow:0 .06rem 0 rgba(0,0,0,.2);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff9d1a);border-radius:.2rem;transition:width .4s}
/* ---------- sokak ve müşteriler ---------- */
.street{grid-area:2/1/3/2;position:relative;z-index:3;min-height:0}
.sahne{grid-area:1/1/3/3;position:relative;overflow:hidden;pointer-events:none;z-index:0}
.sahne svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sahne .bulut{animation:bulut 70s linear infinite alternate}
.sahne .bulut.b2{animation-duration:95s;animation-direction:alternate-reverse}
/* tente: kendi CSS çizimimiz (g/awning.webp renkleri); yatayda uzun şerit, altta dalgalı saçak */
.awning{position:absolute;z-index:1;left:0;right:0;top:0;height:.7rem;background:linear-gradient(rgba(0,0,0,0) 30%,rgba(60,0,0,.5)),repeating-linear-gradient(90deg,#ad0000 0 .8rem,#a96a68 .8rem 1.6rem);border-bottom:.07rem solid #4a0000;pointer-events:none}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:.34rem;background:radial-gradient(circle at 50% 0,#6e0505 0 .36rem,transparent .375rem) 0 0/.8rem .34rem repeat-x;filter:drop-shadow(0 .05rem 0 rgba(0,0,0,.25))}
.direk{position:absolute;z-index:1;top:.7rem;bottom:.3rem;width:.22rem;border-radius:.1rem;background:linear-gradient(90deg,#7a4a1c,#c98b4a 45%,#7a4a1c);border:.04rem solid var(--ink);pointer-events:none}
.direk.d1{left:calc(var(--sl) + .12rem)}.direk.d2{right:.12rem}
.pervaz{position:absolute;z-index:3;left:0;right:0;bottom:0;height:.44rem;background:linear-gradient(#d8964a,#b26f2c 45%,#8a5220);border-top:.1rem solid #f0b46a;box-shadow:inset 0 -.1rem 0 rgba(0,0,0,.18),0 -.06rem .1rem rgba(0,0,0,.18);pointer-events:none}
.pervaz::after{content:"";position:absolute;inset:.11rem 0 auto;height:.05rem;background:repeating-linear-gradient(90deg,rgba(80,40,10,.35) 0 1.8rem,transparent 1.8rem 2rem)}
.queue{position:absolute;z-index:2;left:calc(var(--sl) + .3rem);right:.3rem;top:.08rem;bottom:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.1rem}
.slot{position:relative;height:100%}
.cust{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;transform:translateY(70%);opacity:0;transition:transform .5s cubic-bezier(.2,1.25,.4,1),opacity .25s}
.cust.in{transform:none;opacity:1}
.cust.out{transform:translateY(80%);opacity:0;transition:transform .45s ease-in,opacity .45s ease-in}
.cust .yuz{width:var(--yz,2rem);aspect-ratio:128/154;transform-origin:50% 100%;filter:drop-shadow(0 .1rem .06rem rgba(0,0,0,.25));transition:transform .2s}
.yuz svg,.hero .f svg,.mf svg{width:100%;height:100%;display:block}
.bub{position:relative;width:var(--bw,3rem);max-width:100%;background:#fff;border:.07rem solid var(--ink);border-radius:.4rem;padding:.1rem .12rem .12rem;margin-bottom:.2rem;display:flex;flex-direction:column;align-items:center;gap:.08rem;box-shadow:0 .1rem 0 rgba(0,0,0,.15);transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.bub::after{content:"";position:absolute;left:50%;bottom:-.22rem;width:.3rem;height:.3rem;background:inherit;border-right:.07rem solid var(--ink);border-bottom:.07rem solid var(--ink);border-color:inherit;border-top-color:transparent;border-left-color:transparent;transform:translateX(-50%) rotate(45deg)}
.bub .sip{width:100%;display:flex;justify-content:center}
.sabir{width:100%;height:.22rem;flex:none;border-radius:.2rem;background:#e9e1d4;box-shadow:inset 0 .03rem 0 rgba(0,0,0,.12);overflow:hidden}
.sabir b{display:block;height:100%;width:100%;border-radius:.2rem;background:#3cc45a;box-shadow:inset 0 .05rem 0 rgba(255,255,255,.35)}
.cust.hedef .bub{transform:scale(1.06);border-color:#e8a400;box-shadow:0 0 0 .12rem rgba(255,194,26,.75),0 .1rem 0 rgba(0,0,0,.15)}
.cust.hedef .yuz{transform:scale(1.08) translateY(-.1rem)}
.cust.kizgin .yuz{filter:drop-shadow(0 0 .12rem rgba(230,40,30,.55)) drop-shadow(0 .1rem .06rem rgba(0,0,0,.25))}
.cust.mutlu-git .yuz{animation:hop .45s ease-out 2}
.cust.kizgin-git .yuz{animation:shake .3s linear 3}
.cust.ret .bub{background:#ffd9d4;border-color:#b3140c;animation:shake .26s linear 2}
.cust.cik .bub{opacity:0;transform:scale(.6);transition:opacity .2s .25s,transform .2s .25s}
/* müşteri yüzleri (www/musteri.js): duygu animasyonları */
@keyframes mu-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mu-tap{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes mu-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes mu-sink{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes mu-rise{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
@keyframes mu-drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes mu-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes mu-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mu{transform-box:view-box;transform-origin:60px 140px}
.m-happy{animation:mu-hop 1s ease-in-out infinite}.m-wait{animation:mu-sink 2.6s ease-in-out infinite}.m-imp{animation:mu-tap .5s ease-in-out infinite}
.m-angry{animation:mu-shake .22s linear infinite}.m-love{animation:mu-hop .8s ease-in-out infinite}.m-sad{animation:mu-sink 3s ease-in-out infinite}
.mu .blink{animation:mu-blink 4s infinite;transform-box:fill-box;transform-origin:center}
svg .st{animation:mu-rise 1.1s ease-out infinite}svg .st.d2{animation-delay:.37s}svg .st.d3{animation-delay:.74s}
svg .sw,svg .tr{animation:mu-drip 1.3s ease-in infinite}svg .hb{animation:mu-pulse .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
/* ---------- tezgâh ---------- */
.counter{grid-area:3/1/4/2;position:relative;z-index:4;height:calc(clamp(3.5rem,36cqh,6rem) + var(--sb));background:linear-gradient(#b17a2c,#8a5a1c 55%,#6d4410);border-top:.14rem solid #4a2c08;box-shadow:inset 0 .2rem 0 rgba(255,255,255,.12),0 -.1rem .2rem rgba(0,0,0,.18);display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:.12rem;align-items:center;padding:.4rem .24rem calc(var(--sb) + .2rem) calc(var(--sl) + .24rem)}
.counter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 1rem,rgba(0,0,0,.07) 1rem 1.06rem),repeating-linear-gradient(90deg,transparent 0 3.3rem,rgba(0,0,0,.05) 3.3rem 3.35rem);pointer-events:none}
/* arka duvar şeridi: fayans */
.counter::after{content:"";position:absolute;left:0;right:0;top:0;height:.3rem;background:linear-gradient(rgba(0,0,0,.0) 80%,rgba(0,0,0,.18)),repeating-linear-gradient(90deg,#fffaf0 0 .62rem,#d9cdb8 .62rem .66rem),#fffaf0;border-bottom:.06rem solid #4a2c08;pointer-events:none}
/* ızgara: gözler yan yana (2 ya da 3), göz boyu --gz fit()'te tezgâh yüksekliğinden */
.grill{position:relative;align-self:center;display:grid;grid-template-columns:repeat(2,var(--gz,1.4rem));grid-template-rows:auto var(--gz,1.4rem);gap:.1rem .1rem;background:linear-gradient(#4a4d55,#33363c);border:.08rem solid #17181c;border-radius:.36rem;padding:.1rem .12rem .14rem;box-shadow:0 .1rem 0 rgba(0,0,0,.3)}
.grill.g3{grid-template-columns:repeat(3,var(--gz,1.4rem))}
.grill small{grid-column:1/-1;font-size:max(10px,.26rem);font-weight:800;color:#ffd9a8;letter-spacing:.06em;text-transform:uppercase;line-height:1;text-align:center}
.gs{position:relative;width:var(--gz,1.4rem);height:var(--gz,1.4rem);border-radius:.3rem;background:repeating-linear-gradient(90deg,#1c1d21 0 .12rem,#55585f .12rem .21rem);display:grid;place-items:center;box-shadow:inset 0 0 0 .06rem #0d0e10;touch-action:manipulation;transition:box-shadow .4s}
.gs::before{content:"";position:absolute;inset:-.05rem}
.gs .sil{width:78%;height:78%;opacity:.22;filter:brightness(0) invert(1)}
.gs .sil img{width:100%;height:100%}
.gs .kof{width:80%;height:80%;position:relative;z-index:2}
.gs .kof img{width:100%;height:100%}
.gs .kof img.pis{position:absolute;inset:0;opacity:var(--pis,0)}
.gs.cig{box-shadow:inset 0 0 0 .06rem #0d0e10,inset 0 -.3rem .4rem rgba(255,110,20,.75),inset 0 0 .6rem rgba(255,80,0,.35);animation:kor 1.1s ease-in-out infinite}
.gs.cig .kof{animation:sizzle .22s linear infinite}
.gs .cember{position:absolute;left:4%;top:4%;width:92%;height:92%;border-radius:50%;z-index:1;background:conic-gradient(#ffcf4a calc(var(--pis,0)*1turn),rgba(0,0,0,.45) 0);-webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%)}
.gs.hazir{box-shadow:inset 0 0 0 .06rem #0d0e10,0 0 0 .09rem var(--gold),inset 0 -.2rem .3rem rgba(255,150,30,.5);animation:pulse .6s ease-in-out infinite}
.gs .duman{position:absolute;top:-.2rem;width:.7rem;height:.7rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);filter:blur(.06rem);animation:smoke 1.6s ease-out infinite;pointer-events:none;z-index:3}
.gs .duman.d1{left:5%}.gs .duman.d2{left:38%;animation-delay:.55s}.gs .duman.d3{left:68%;animation-delay:1.1s}
.gs .kivilcim{position:absolute;width:.1rem;height:.1rem;border-radius:50%;background:#ffd36b;box-shadow:0 0 .1rem #ff9a1a;z-index:3;animation:kivil .9s ease-out infinite;pointer-events:none}
.gs .kivilcim.k1{left:30%;top:55%}.gs .kivilcim.k2{left:62%;top:45%;animation-delay:.4s}.gs .kivilcim.k3{left:48%;top:65%;animation-delay:.7s}
.gs .parilti{position:absolute;inset:0;z-index:3;pointer-events:none}
.gs .parilti i{position:absolute;width:.3rem;height:.3rem;background:#fff6b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:parilti 1s ease-in-out infinite}
.gs .parilti i:nth-child(1){left:12%;top:14%}.gs .parilti i:nth-child(2){right:12%;top:30%;animation-delay:.35s}.gs .parilti i:nth-child(3){left:40%;bottom:10%;animation-delay:.7s}
.gs:active{transform:translateY(.05rem) scale(.98)}
.tabak{position:relative;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;border-radius:.4rem;cursor:pointer}
/* kesme tahtası */
.tabak::before{content:"";position:absolute;left:0;right:0;margin-inline:auto;width:min(calc(100% + .08rem),calc(var(--gen,3rem) + .9rem));bottom:.08rem;height:1.3rem;border-radius:.36rem;background:linear-gradient(#d9a465,#c08544 60%,#a86e33);border:.06rem solid #5a3510;box-shadow:0 .1rem 0 rgba(0,0,0,.3),inset 0 .08rem 0 rgba(255,235,200,.35);pointer-events:none}
.tabak::after{content:"";position:absolute;left:50%;bottom:1.06rem;width:.5rem;height:.14rem;margin-left:-.25rem;border-radius:.1rem;background:#5a3510;opacity:.55;pointer-events:none}
.tabak .tno{position:absolute;bottom:-.16rem;left:50%;transform:translateX(-50%);z-index:2;font-size:max(10px,.28rem);font-weight:800;color:#ffe9c4;background:#5a3510;padding:.02rem .18rem;border-radius:.2rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;white-space:nowrap}
.tabak .tab{position:absolute;left:0;right:0;margin-inline:auto;width:min(calc(100% + .16rem),calc(var(--gen,3rem) + 1rem));bottom:.22rem;height:1.2rem;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,#fff 0 46%,#e7e3da 47% 62%,#fff 63%);box-shadow:0 .12rem 0 rgba(0,0,0,.28),inset 0 0 0 .06rem #cfc8ba;transition:box-shadow .2s;transform-origin:50% 60%}
.tabak .yig{position:relative;z-index:1;width:var(--gen,2.6rem);margin-bottom:.66rem;display:flex;justify-content:center;align-items:flex-end;transform-origin:50% 100%}
.tabak.wob .yig{animation:squash .32s ease-out}
.tabak.wob .tab{animation:wob .38s ease-out}
.tabak.tasiniyor .yig{opacity:.18;filter:grayscale(1)}
.tabak.parla .tab{animation:halka .9s ease-in-out infinite}
.cop{position:relative;justify-self:center;width:max(44px,1.26rem);height:max(52px,1.6rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.06rem;border-radius:.36rem;background:#e9e4da;border:.08rem solid var(--ink);box-shadow:0 .1rem 0 rgba(0,0,0,.3)}
.cop .ic{width:.84rem;height:.84rem}
.cop small{font-size:max(10px,.26rem);font-weight:800;color:#6a5646;line-height:1}
.cop.hedef{background:#ffe08a;transform:scale(1.1);box-shadow:0 0 0 .1rem rgba(255,194,26,.7),0 .1rem 0 rgba(0,0,0,.3)}
.cop.yut{animation:yut .4s ease-out}
/* ---------- malzeme tepsisi ---------- */
.tray{grid-area:2/2/4/3;position:relative;z-index:6;background:#3a2412;border-left:.12rem solid #1f1208;border-top:.12rem solid #1f1208;border-top-left-radius:.3rem;padding:.16rem calc(var(--sr) + .16rem) calc(var(--sb) + .2rem) .16rem;display:grid;grid-template-columns:repeat(3,var(--kw,1.8rem));grid-auto-rows:var(--kh,1.5rem);gap:var(--kg,.18rem) .14rem;align-content:center;box-shadow:-.06rem 0 .2rem rgba(0,0,0,.25)}
/* 15 kutu: 3 sütun × 5 satır; kutu yüksekliği --kh ve satır aralığı --kg fit() içinde tepsi yüksekliğinden (en az 44 px) */
.ing{position:relative;width:auto;height:auto;border-radius:.36rem;background:var(--cream);border:.07rem solid var(--ink);box-shadow:0 .1rem 0 #170d05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.02rem;transition:transform .12s,box-shadow .12s,background .15s;touch-action:manipulation;min-width:0}
.ing .im{width:calc(var(--kh,1.6rem)*.6);height:calc(var(--kh,1.6rem)*.6);max-width:90%;display:grid;place-items:center;transition:opacity .15s,transform .15s}
.ing .im>*{width:100%;height:100%;max-width:100%;max-height:100%}
.ing .im img,.ing .im svg{width:100%;height:100%;object-fit:contain}
.ing .ad{font-size:max(10px,.26rem);letter-spacing:-.01em;font-weight:800;line-height:1;color:#6a5040;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ing .al{position:absolute;left:50%;top:calc(var(--kh,1.6rem)*.08);width:calc(var(--kh,1.6rem)*.62);height:calc(var(--kh,1.6rem)*.62);transform-origin:50% 60%;margin-left:calc(var(--kh,1.6rem)*-.31);pointer-events:none;opacity:0;z-index:3}
.ing .al .im2{width:100%;height:100%}
.ing .al .im2>*,.ing .al img,.ing .al svg{width:100%;height:100%;object-fit:contain}
.ing .gol{position:absolute;left:50%;top:calc(var(--kh,1.6rem)*.58);width:.9rem;height:.24rem;margin-left:-.45rem;border-radius:50%;background:rgba(40,20,5,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:scale(.6)}
.ing.sec{background:#fff8e2;transform:translateY(.08rem);box-shadow:0 .03rem 0 #170d05,0 0 0 .1rem var(--gold),inset 0 0 .2rem rgba(255,194,26,.5);border-color:#7a4a00;z-index:4}
.ing.sec .im{opacity:.28;transform:scale(.9)}
.ing.sec .gol{opacity:1;transform:scale(1)}
.ing.sec .al{opacity:1;animation:avucla .26s cubic-bezier(.2,1.5,.4,1) forwards,salin 1.6s ease-in-out .26s infinite}
.ing.sec .al .im2{filter:drop-shadow(0 .16rem .1rem rgba(0,0,0,.4))}
.ing:active:not(.kilit){transform:translateY(.08rem);box-shadow:0 .03rem 0 #170d05}
.ing.sec:active{box-shadow:0 .03rem 0 #170d05,0 0 0 .1rem var(--gold)}
.ing.kilit{background:#6b5a4b;cursor:default}
.ing.kilit .im{filter:brightness(0) opacity(.28)}
.ing.kilit .ad{color:#f3e3cf;display:flex;align-items:center;gap:.04rem;font-variant-numeric:tabular-nums}
.ing.kilit .ad .ic{width:.32rem;height:.32rem}
.ing.kilit .im{position:relative}
.ing.yeni-m::before{content:attr(data-yeni);position:absolute;top:-.22rem;right:-.14rem;background:var(--red);color:#fff;font-size:max(10px,.26rem);font-weight:900;padding:.05rem .16rem;border-radius:.2rem;transform:rotate(8deg);z-index:5;border:.04rem solid var(--ink)}
