<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Burger Ustası</title><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Burger Ustası: YATAY mutfak oyunu. 7. tur (21 Kasım): Eymen'in resmi (docs/referans/mutfak-v3-eymen.png) oyunun arka planı.
   Ekran: #sahne > #dunya (resmin pikselleriyle 1852×849; js fit() ölçekler): resim, müşteriler (#musK), resmin parçaları ve
   dokunma alanları (#parca), baloncuklar (#balonK), uçanlar (#wfx). Üst bilgi (#hud) iki köşede (#hudL kasa + gün, #hudR
   düğmeler, sıradaki hedef, seri). Birim: 1rem = 10 birim; birim = min(güvenli yükseklik / 100, güvenli genişlik / 190) (üst bilgi, kartlar,
   menüler). Güvenli alan --sl/--sr/--st/--sb (env(); #guv ile ölçülür). Dik tutulursa "yan çevir" (#cevir). */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html{font-size:calc(10*min((100dvh - var(--st) - var(--sb))/100,(100vw - var(--sl) - var(--sr))/190));-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1a12;font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
body{font-size:.44rem}
:root{--ink:#2a1a10;--cream:#fff4dc;--red:#d2281e;--red-d:#8d140e;--gold:#ffc21a;--green:#2e9d3e;--good:#37c25a;--good2:#8bff6a;--bad:#ff5b4f;--sky1:#8fd3ff;--sky2:#d9f3ff}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#3a2416;color:var(--ink);touch-action:none}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{display:block;width:100%;height:100%;flex:none;overflow:visible}
/* ---------- üst bilgi ---------- */
.hud{position:absolute;inset:0;z-index:8;pointer-events:none}
.hk{position:absolute;top:calc(var(--st) + .1rem);display:flex;flex-direction:column;gap:.1rem;pointer-events:none}
.hk>*{pointer-events:auto}
.hk.sol{left:calc(var(--sl) + .16rem);align-items:flex-start}
.hk.sag{right:calc(var(--sr) + .16rem);align-items:flex-end}
.hk .sira{display:flex;align-items:center;gap:.14rem}
.chip{display:flex;align-items:center;gap:.1rem;background:rgba(255,255,255,.94);border:.05rem solid var(--ink);border-radius:.5rem;height:max(34px,.9rem);padding:0 .2rem 0 .08rem;font-weight:900;font-size:max(14px,.42rem);box-shadow:0 .07rem 0 rgba(0,0,0,.2);line-height:1;white-space:nowrap}
.chip .ic{width:max(24px,.64rem);height:max(24px,.64rem)}
.chip.kasa{min-width:min-content;flex:0 0 auto;font-variant-numeric:tabular-nums}
.chip.kasa.neg span{color:var(--red)}
.chip.kasa.pop{animation:kpop .3s ease-out}
.chip.kasa .i{transition:transform .12s}
.chip.kasa.tik .i{transform:scale(1.25) rotate(-12deg)}
.chip.gun{flex-direction:column;align-items:stretch;justify-content:center;gap:max(2px,.05rem);padding:0 .22rem;min-width:max(76px,2rem)}
.chip.gun span{text-align:center}
.chip.seri{height:max(28px,.72rem);font-size:max(13px,.38rem);color:#ffe27a;gap:.06rem;padding:0 .18rem 0 .1rem}
.chip.seri .ic{width:max(20px,.5rem);height:max(20px,.5rem)}
.chip.seri.pop{animation:kpop .35s ease-out}
.chip.seri.sondu{opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s}
.chip.hedef{height:auto;min-height:max(28px,.72rem);flex-direction:row;flex-wrap:wrap;gap:.04rem .08rem;padding:.04rem .18rem .06rem .08rem;font-size:max(11px,.3rem);max-width:max(170px,5.2rem);white-space:normal}
.chip.hedef .i .ic{width:max(18px,.46rem);height:max(18px,.46rem)}
.chip.hedef .ht{flex:1 1 0;min-width:0;line-height:1.1;color:#ffe3b0}
.chip.hedef .prog{flex:1 0 100%;height:max(4px,.1rem)}
.chip.hedef.ok{box-shadow:0 0 0 .05rem #ffc21a,0 0 .3rem rgba(255,190,40,.8)}
.chip.hedef.ok .ht{color:#ffe27a}
.chip.hedef.kart{margin:.12rem auto 0;max-width:none}
.ucan.sikke.bah .ic{filter:drop-shadow(0 0 .1rem #fff6a0) brightness(1.15)}
.info .mf .kb{display:block;width:100%;height:100%;background-size:240% auto;background-position:50% 2%;background-repeat:no-repeat;border-radius:.2rem}
.hero .f{overflow:hidden}
.hero .f .kg{display:block;height:5.2rem;width:auto;max-width:none;margin-left:50%;transform:translateX(-50%);filter:drop-shadow(.06rem .04rem .05rem rgba(45,16,6,.35))}
.home .hsag .chip.hedef{margin-top:.12rem;max-width:none}
.hb{position:relative;width:max(34px,.9rem);height:max(34px,.9rem);border-radius:50%;background:rgba(255,255,255,.94);border:.05rem solid var(--ink);box-shadow:0 .07rem 0 rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
.hb .ic{width:62%;height:62%}
.hb:active{transform:translateY(.06rem);box-shadow:0 .02rem 0 rgba(0,0,0,.2)}
.hb::before,.home .lang::before{content:"";position:absolute;inset:min(0px,calc((max(34px,.9rem) - 44px)/2))}
.prog{position:relative;flex:none;height:max(5px,.14rem);border-radius:.2rem;background:#eadfcc;box-shadow:inset 0 .03rem 0 rgba(0,0,0,.18);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff9d1a);border-radius:.2rem;transition:width .4s}
/* ---------- sahne (7. tur): Eymen'in resmi arka plan, değişen her şey üstünde (sahne birimi = resmin pikseli) ---------- */
/* #dunya 1852×849 birim; js fit() translate + scale ile ekrana oturtur. Sıra: resim (#arka), müşteriler (#musK: arka tezgâhın
   üst çizgisinde kesilir, gövdeleri tezgâhın arkasında kalır), parçalar ve dokunma alanları (#parca), baloncuklar (#balonK),
   uçanlar (#wfx). Ekranın fazlası resmin uzatılmış kenarı (g/v3/mutfak.webp). */
.sahne{position:absolute;inset:0;z-index:1;overflow:hidden;background:#1e110c}
.dunya{position:absolute;left:0;top:0;width:1852px;height:849px;transform-origin:0 0}
.dunya img{position:absolute;display:block;max-width:none;-webkit-user-select:none;user-select:none}
#parca,#balonK,#wfx,#paraK,#dkK,#canli{position:absolute;left:0;top:0;width:1852px;height:849px;pointer-events:none}
#wfx{z-index:5}#balonK{z-index:2}#paraK{z-index:3}#dkK{z-index:4}
#canli{overflow:hidden}
.hit{position:absolute;pointer-events:auto;touch-action:none;border-radius:22px;cursor:pointer}
.hit.red{animation:redW .35s ease-out}
.hit.parla{animation:parlaW .8s ease-in-out infinite alternate}
.hit.sec{box-shadow:0 0 0 6px rgba(255,214,90,.95),0 0 28px rgba(255,200,40,.85)}
.hit.bekliyor{animation:parlaW 1.1s ease-in-out infinite alternate}
@keyframes redW{0%{box-shadow:0 0 0 0 rgba(230,40,30,0)}30%{box-shadow:0 0 0 7px rgba(230,40,30,.85),0 0 26px rgba(230,40,30,.6)}100%{box-shadow:0 0 0 0 rgba(230,40,30,0)}}
@keyframes parlaW{from{box-shadow:0 0 0 4px rgba(255,214,90,.75),0 0 14px rgba(255,200,40,.5)}to{box-shadow:0 0 0 9px rgba(255,214,90,.95),0 0 40px rgba(255,200,40,.85)}}
.p.kon{animation:konP .32s ease-out}
@keyframes konP{0%{filter:brightness(1)}35%{filter:brightness(1.35)}100%{filter:brightness(1)}}
/* müşteriler (9. tur): 20 karakter görseli (g/karakter, tek hâl). Salondan yürüyerek gelir (yaylanarak, küçükten büyüyerek),
   arka tezgâhın arkasında durur (#musK y 311'de keser), hafifçe nefes alır; giderken yürüyerek çıkar. Sahnenin sıcak ışığına
   uysun diye hafif sepya ve sağ alta yumuşak gölge (çizimler değişmez). */
.musK{position:absolute;left:0;top:0;width:1852px;height:311px;overflow:hidden;pointer-events:none}
.mus{position:absolute;opacity:0;transform:translate(var(--gx,200px),30px) scale(.8);transform-origin:50% 100%;transition:transform .95s cubic-bezier(.25,.7,.35,1),opacity .35s}
.mus.in{opacity:1;transform:none}
.mus .yuz{position:absolute;inset:0;transform-origin:50% 100%}
.mus .kg{display:block;width:100%;height:100%;filter:sepia(.1) saturate(1.04) brightness(.98) drop-shadow(14px 9px 8px rgba(45,16,6,.45));-webkit-user-drag:none;user-select:none}
.mus.sevin .yuz{animation:kZipla .42s ease-out 2}
.mus.sevin1 .yuz{animation:kZipla .4s ease-out 1}
.mus.out{opacity:0;transform:translate(calc(var(--gx,200px)*-1),30px) scale(.82);transition:transform 1s ease-in,opacity .5s .45s}
.mus.out .yuz{animation:kYuru .32s ease-in-out 4}
@keyframes kYuru{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-9px) rotate(-1.6deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-9px) rotate(1.6deg)}}
@keyframes kNefes{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.018)}}
@keyframes kZipla{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(4px) scale(1.04,.95)}55%{transform:translateY(-22px) scale(.97,1.05)}100%{transform:translateY(0) scale(1,1)}}
.balon.acil{animation:titre .5s ease-in-out infinite}
@keyframes titre{0%,100%{translate:0 0}25%{translate:-1.5px 0}75%{translate:1.5px 0}}
/* dokunuş tepkisi: resmin parçası kırpılıp ezilir (#ezK resmin hemen üstünde, parçaların altında) */
#ezK{position:absolute;left:0;top:0;width:1852px;height:849px;pointer-events:none}
.ez{position:absolute;background-image:url(g/v3/mutfak.webp);background-size:2332px 1459px;background-repeat:no-repeat;transform-origin:50% 100%}
/* doğrama: yığından alınan patates küçülür, dilimler birikir */
.dpat{position:absolute;width:124px;height:90px;transform:scale(var(--k,1));transform-origin:50% 80%;transition:transform .12s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 6px 3px rgba(40,15,5,.35))}
.dpat svg{width:100%;height:100%;display:block}
.dilimler{position:absolute;width:120px;height:30px;pointer-events:none}
.dilimler .dl{position:absolute;width:40px;height:11px;border-radius:5px;background:linear-gradient(#fffbe4,#f6e2a2 55%,#e8c070);border:2.5px solid #7a4a14;transform:rotate(var(--r,0deg));animation:dlDus .22s ease-out both}
@keyframes dlDus{from{translate:0 -26px;opacity:0}to{translate:0 0;opacity:1}}
/* tablet → dükkân: alınabilir öğe sayısı */
.tbrz{position:absolute;min-width:40px;height:40px;padding:0 8px;border-radius:20px;background:#d2281e;border:4px solid #2a140a;color:#fff;font:900 26px/32px "Baloo 2",sans-serif;text-align:center;box-shadow:0 0 14px rgba(255,90,40,.8);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
.neon .nt.tk{font-size:15px;letter-spacing:.5px}
.balon{position:absolute;top:116px;width:162px;padding:6px 7px 8px;background:linear-gradient(#fffaf0,#fbeed6);border:4px solid #3a1d0c;border-radius:20px;box-shadow:inset 0 3px 0 #fff,inset 0 -4px 0 rgba(200,150,90,.25),0 6px 0 rgba(40,15,5,.35),0 12px 18px rgba(40,15,5,.3);opacity:0;transform:scale(.4);transform-origin:0 70%;transition:opacity .2s .35s,transform .3s .35s cubic-bezier(.2,1.5,.4,1)}
.balon::after{content:"";position:absolute;left:-15px;top:58%;width:20px;height:20px;background:#fdf3e0;border:4px solid #3a1d0c;border-top-color:transparent;border-right-color:transparent;border-radius:0 0 0 4px;transform:translateY(-50%) rotate(45deg)}
.balon.in{opacity:1;transform:none}
.balon.cik{opacity:0;transform:scale(.6);transition:opacity .2s .3s,transform .2s .3s}
.balon.bekle{border-color:#e8a400;box-shadow:0 0 0 6px rgba(255,194,26,.8),0 6px 0 rgba(40,15,5,.3);animation:bekleB .7s ease-in-out infinite alternate}
.balon.bekle::after{border-left-color:#e8a400;border-bottom-color:#e8a400}
@keyframes bekleB{from{transform:scale(1)}to{transform:scale(1.05)}}
.balon.ret{background:#ffd9d4;border-color:#b3140c;animation:shake .26s linear 2}
.balon.ret::after{background:#ffd9d4;border-left-color:#b3140c;border-bottom-color:#b3140c}
.balon.aldi1{animation:pulse .35s ease-out}
.balon .sip{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:70px}
.balon .b{position:relative;width:82px;height:70px}
.balon .b .mini{--k:.57}
.balon .f{position:relative;width:52px;height:58px;flex:none}
.balon .f .pors{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.balon .alindi{opacity:.28;filter:grayscale(.7)}
.balon .sabir{height:14px;margin-top:6px;border-radius:8px;background:#3a2214;overflow:hidden;border:2.5px solid #2a140a;box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.balon .sabir b{display:block;height:100%;width:100%;border-radius:6px;background:#3cc45a;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.18)}
.hit.mh{top:112px;height:204px;border-radius:30px}
/* burger: yandan (~17° üstten) çizilmiş katmanlar (g/v3/b-*.webp, tools/burger); her katman alttakine oturur, alttakine
   düşen gölgesi (.gl) alttakinin biçimiyle kırpılır; .bz tahtaya/tepsiye düşen gölge. .mini ölçekli kopya (baloncuk, tepsi, kart) */
.burger,.mini{position:absolute}
.burger>img,.mini>img{position:absolute;left:0;width:140px;display:block;transform-origin:50% 100%}
.gl{position:absolute;left:0;width:140px;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.gl>div{position:absolute;inset:0;filter:blur(1.8px)}
.gl i{position:absolute;left:0;width:140px;background:rgba(52,16,0,.6);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.bz{position:absolute;bottom:-6px;left:4px;width:132px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(52,18,4,.55),rgba(52,18,4,.3) 60%,rgba(52,18,4,0));pointer-events:none}
.mini{left:50%;bottom:0;width:140px;height:0;transform:translateX(-50%) scale(var(--k,1));transform-origin:50% 0}
.burger{transition:transform .18s,filter .18s;transform-origin:50% 100%}
/* düşüş: katman uçuşun sonunda tam yerinin 34 birim üstündedir, düşer (hızlanarak), oturunca ezilir ve toparlanır */
.burger>img.yeni{animation:dusK .34s linear both}
.burger>.gl.yeni,.burger>.bz.yeni{animation:glGel .34s linear both}
.burger.bas{animation:basB .3s ease-out .13s}
.burger.sec{transform:translateY(-16px) scale(1.04);filter:drop-shadow(0 0 7px #ffd84a) drop-shadow(0 0 3px #ffb000) drop-shadow(0 18px 10px rgba(50,20,6,.35))}
.burger.tamam{animation:tamamB .42s ease-out .1s}
@keyframes dusK{0%{transform:translateY(-34px);animation-timing-function:cubic-bezier(.5,0,1,1)}38%{transform:translateY(0) scale(1.08,.84);animation-timing-function:ease-out}62%{transform:scale(.97,1.05)}82%{transform:scale(1.01,.98)}100%{transform:none}}
@keyframes glGel{0%,30%{opacity:0}45%{opacity:1}100%{opacity:1}}
@keyframes basB{0%{transform:none}35%{transform:scale(1.015,.965)}100%{transform:none}}
@keyframes tamamB{0%{transform:none}25%{transform:scale(1.07,.88)}55%{transform:scale(.97,1.05)}80%{transform:scale(1.01,.985)}100%{transform:none}}
.tahta{position:absolute;pointer-events:none}
.tepsi>img.tp{position:absolute;left:-5px;top:-2px;width:280px;height:116px}
.tepsi{position:absolute;pointer-events:none;transition:filter .18s,transform .18s}
.tepsi .ic-b .mini{left:92px;--k:.66;transform:translateX(-50%) scale(var(--k));bottom:auto;top:88px}
.tepsi .ic-f .pors{position:absolute;left:166px;top:8px;width:80px;height:87px}
.tepsi.sec{transform:translateY(-8px);filter:drop-shadow(0 0 8px #ffd84a) drop-shadow(0 0 3px #ffb000)}
.tepsi.kon .ic-b,.tepsi.kon .ic-f{animation:kayT .3s ease-out}
.tepsi.yeni{animation:tpGel .45s ease-out}
.tepsi.giden{z-index:3}
@keyframes kayT{0%{transform:translateY(-6px) scale(1.06)}60%{transform:translateY(2px) scale(.97)}100%{transform:none}}
@keyframes tpGel{0%{transform:translateY(46px);opacity:0}100%{transform:none;opacity:1}}
/* ızgara: çiğ köfte düşer, pişerken renk çiğden pişmişe (--p), duman; halka ilerleme */
.gk{position:absolute;pointer-events:none}
.gk img{position:absolute;inset:0;width:100%;height:100%}
.gk .pis{opacity:var(--p,0)}
.gk.hazir .pis{opacity:1}.gk.hazir{filter:drop-shadow(0 0 8px rgba(255,214,90,.95))}
.gk.dus{animation:gkDus .32s cubic-bezier(.3,1.4,.5,1)}
.gk.pisiyor{animation:cizir .14s linear infinite alternate}
.gk .duman{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.6),rgba(255,255,255,0) 68%);opacity:0;left:40%;top:0}
.gk.pisiyor .duman,.gk.hazir .duman{animation:dumanW 1.8s ease-out infinite}
.gk .d2{left:15%;animation-delay:.6s!important}.gk .d3{left:65%;animation-delay:1.2s!important}
@keyframes gkDus{0%{transform:translateY(-60px) scale(.9);opacity:.2}60%{transform:translateY(4px) scale(1.05,.92);opacity:1}100%{transform:none}}
@keyframes cizir{from{translate:0 0}to{translate:.8px -.6px}}
@keyframes dumanW{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:.75}100%{transform:translateY(-90px) scale(1.6);opacity:0}}
.halka{position:absolute;width:54px;height:54px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4));pointer-events:none}
.halka svg{width:100%;height:100%;transform:rotate(-90deg)}
.halka .z{fill:rgba(30,15,8,.7);stroke:#3a1d0c;stroke-width:5}
.halka .d{fill:none;stroke:#ffcf3a;stroke-width:6;stroke-linecap:round}
/* fritöz: kabarcık, buhar, gösterge (yedi parçalı kırmızı rakam), ışıklar */
.kabarcik,.buhar{position:absolute;pointer-events:none;overflow:hidden}
.kabarcik i{position:absolute;bottom:2px;width:9px;height:9px;border-radius:50%;border:2px solid rgba(255,246,200,.95);animation:kab .8s ease-in infinite}
@keyframes kab{0%{transform:translateY(0) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-52px) scale(1.1);opacity:0}}
.buhar{overflow:visible}.buhar i{position:absolute;bottom:0;left:30%;width:60px;height:60px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 68%);animation:dumanW 2s ease-out infinite}
.buhar i:nth-child(2){left:5%;animation-delay:.7s}.buhar i:nth-child(3){left:58%;animation-delay:1.3s}
.rakam{position:absolute;pointer-events:none}
.rakam rect.on{fill:#ff3d24;filter:drop-shadow(0 0 1.5px #ff2a10)}
.rakam rect.off{fill:rgba(140,25,12,.14)}
.led{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;opacity:0}
.led.on{opacity:1}
.led.kir.on{background:radial-gradient(#ffb3a8,#ff2a12 55%,rgba(255,40,20,0) 72%);box-shadow:0 0 14px 5px rgba(255,40,20,.55);animation:ledY .5s ease-in-out infinite alternate}
.led.yes.on{background:radial-gradient(#d9ffc8,#36d23a 55%,rgba(40,210,60,0) 72%);box-shadow:0 0 14px 5px rgba(40,210,60,.55)}
@keyframes ledY{from{opacity:.55}to{opacity:1}}
/* doğrama: çubuk (10 parça), bıçak izi, kırıntı, fritöze uçan çubuklar */
.dogra{position:absolute;display:flex;gap:2px;padding:3px;background:rgba(30,15,8,.8);border:3px solid #3a1d0c;border-radius:10px;pointer-events:none}
.dogra i{flex:1;border-radius:3px;background:#5a4030}
.dogra i.on{background:linear-gradient(#fff0a0,#f0a020)}
.dogra.red{border-color:#c4160c;animation:shake .26s linear 2}
.bicak{position:absolute;width:140px;height:120px;pointer-events:none;transform-origin:85% 40%;filter:drop-shadow(4px 8px 4px rgba(40,15,5,.4));animation:bicakW .36s ease-out forwards}
.bicak svg{width:100%;height:100%}

/* müşteri yüzleri (www/musteri.js): duygu animasyonları */
@keyframes mu-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mu-tap{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes mu-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes mu-sink{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes mu-rise{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
@keyframes mu-drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes mu-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes mu-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mu{transform-box:view-box;transform-origin:60px 140px}
.m-happy{animation:mu-hop 1s ease-in-out infinite}.m-wait{animation:mu-sink 2.6s ease-in-out infinite}.m-imp{animation:mu-tap .5s ease-in-out infinite}
.m-angry{animation:mu-shake .22s linear infinite}.m-love{animation:mu-hop .8s ease-in-out infinite}.m-sad{animation:mu-sink 3s ease-in-out infinite}
.mu .blink{animation:mu-blink 4s infinite;transform-box:fill-box;transform-origin:center}
svg .st{animation:mu-rise 1.1s ease-out infinite}svg .st.d2{animation-delay:.37s}svg .st.d3{animation-delay:.74s}
svg .sw,svg .tr{animation:mu-drip 1.3s ease-in infinite}svg .hb{animation:mu-pulse .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- 8. tur biçemi: arayüz parçaları resmin paletinden (koyu sıcak kahve, krem, neon turuncu) ---------- */
/* rozetler ve yuvarlak düğmeler: resmin tabelası/sipariş ekranı gibi koyu kahve, krem yazı, ince neon kenar */
.chip,.hb,.home .lang{background:linear-gradient(#55321f,#301b10 72%);border:.05rem solid #160903;color:#fff1d6;box-shadow:inset 0 .035rem 0 rgba(255,214,150,.32),inset 0 0 0 .035rem rgba(255,150,60,.38),0 .07rem 0 rgba(0,0,0,.4),0 .12rem .22rem rgba(20,8,2,.35)}
.chip.kasa.neg span{color:#ff8a72}
.chip.gun span{color:#ffe3b0}
.prog{background:#1a0d06;box-shadow:inset 0 .03rem .05rem rgba(0,0,0,.7)}
.prog b{background:linear-gradient(90deg,#ffd45a,#ff8a1a);box-shadow:0 0 .14rem rgba(255,150,40,.85)}
.hb:active{box-shadow:inset 0 .035rem 0 rgba(255,214,150,.32),inset 0 0 0 .035rem rgba(255,150,60,.38),0 .02rem 0 rgba(0,0,0,.4)}
.home .lang span{color:#c9a37e}
.home .lang span.on{background:linear-gradient(#ffb44a,#ff8a1a);color:#2e1a10;box-shadow:0 0 .12rem rgba(255,150,40,.7)}
/* ipucu ve uyarı balonları: koyu kahve, krem yazı, neon turuncu kenar (uyarı kırmızımsı) */
.ipucu{background:linear-gradient(#55321f,#301b10);color:#fff1d6;border:.045rem solid #ffae4a;box-shadow:0 0 .22rem rgba(255,150,40,.55),0 .1rem 0 rgba(0,0,0,.35)}
.ipucu::after{background:#301b10;border-right:.045rem solid #ffae4a;border-bottom:.045rem solid #ffae4a}
.ipucu.alt::after{background:#55321f;border:0;border-left:.045rem solid #ffae4a;border-top:.045rem solid #ffae4a}
.ipucu.yan.sag::after{background:#432617;border:0;border-top:.045rem solid #ffae4a;border-right:.045rem solid #ffae4a}
.uyari{background:linear-gradient(#5e2216,#3a120a);color:#fff0e4;border:.045rem solid #ff7a56;box-shadow:0 0 .2rem rgba(255,90,50,.5),0 .1rem 0 rgba(0,0,0,.3)}
/* doğrama çubuğu: koyu kahve yuva, neon turuncu dolum */
.dogra{background:linear-gradient(#4b2a18,#2a170c);border-color:#160903;box-shadow:inset 0 0 0 2px rgba(255,150,60,.35),0 4px 0 rgba(0,0,0,.3)}
.dogra i{background:#1c0f08;box-shadow:inset 0 2px 2px rgba(0,0,0,.6)}
.dogra i.on{background:linear-gradient(#fff0a0,#ffb030 60%,#f08a10);box-shadow:0 0 6px rgba(255,170,40,.8)}
/* ızgara ilerleme halkası */
.halka .z{fill:rgba(40,20,10,.85);stroke:#160903}
.halka .d{stroke:#ffb43a;filter:drop-shadow(0 0 2px #ff9a1a)}
/* kartlar: krem kâğıt, koyu kahve kenar, içte ince sıcak çizgi */
.card{background:linear-gradient(#fff7e6,#fbe9cc);border-color:#2e1a10;box-shadow:inset 0 0 0 .07rem #f3d29a,0 .2rem 0 rgba(0,0,0,.45),0 .4rem 1rem rgba(0,0,0,.35)}
.card h2{color:#9a1e10;text-shadow:0 .04rem 0 #fff}
/* ana menü ve dükkân: arka plan Eymen'in mutfağı (bulanık, karartılmış; g/v3/menu-arka.webp) */
.home{background:#2b1810 url(g/v3/menu-arka.webp) center/cover no-repeat}
.home .isin{opacity:.55;mix-blend-mode:screen}
.hero .pl{width:auto;height:auto;border-radius:0;background:none;box-shadow:none}

/* ---------- telefon dik tutulursa: "Telefonu yan çevir" (oyun duraklar) ---------- */
.cevir{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5vmin;padding:8vmin;text-align:center;background:radial-gradient(circle at 50% 40%,#ffe27a,#ffb347 45%,#f07a32 80%,#d9502a);color:var(--ink)}

/* saat: gün kutusunda kırmızı yedi parçalı rakamlar (fritöz göstergesinin biçeminde); son 10 sn kızarır */

.chip.gun .gs{display:flex;align-items:center;justify-content:space-between;gap:.12rem}

.dkgri{position:absolute;border-radius:14px;background:rgba(70,60,55,.55);mix-blend-mode:saturation;pointer-events:none}
.dkgri::after{content:"";position:absolute;inset:0;border-radius:14px;background:rgba(20,12,8,.35)}
.etk{position:absolute;width:0;height:0;pointer-events:none;animation:sallan 2.8s ease-in-out infinite;transform-origin:0 0}
.etk .ip{position:absolute;left:-10px;top:-6px;width:20px;height:70px;overflow:visible}
.etk .ip path{stroke:#2a1a10;stroke-width:4;fill:none}.etk .ip circle{fill:#9a9a9a;stroke:#2a1a10;stroke-width:3}
.etk .kt{position:absolute;left:0;top:52px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 18px 8px 14px;white-space:nowrap;background:#fff4dc;border:6px solid #2a1a10;border-radius:16px;font:900 44px/1 "Baloo 2",sans-serif;color:#2a1a10;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.etk .kt::before{content:"";position:absolute;left:50%;top:-1px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#2a1a10}
.etk .kt .ic{width:44px;height:44px}
.etk .kt .pp{display:flex;gap:4px;margin-left:4px}.etk .kt .pp i{width:10px;height:22px;border-radius:4px;background:#d8c6a8}.etk .kt .pp i.on{background:var(--green)}
.etk.ok .kt{background:linear-gradient(#ffd25a,#ff9d1a);animation:etkOk 1s ease-in-out infinite}
.etk.yok .kt{background:#d8cfc2;color:#6a5646}
.etk.kilit .kt{background:#8a7a6a;color:#f4e8d8}
.etk.tam .kt{background:#37c25a;color:#fff;padding:8px 12px}
@keyframes sallan{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes etkOk{0%,100%{box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 0 0 rgba(255,190,40,0)}50%{box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 0 10px rgba(255,190,40,.7),0 0 40px rgba(255,160,30,.95)}}
#dkK .hit.dkh{pointer-events:auto}
.dk{position:absolute;inset:0;z-index:12;pointer-events:none}
.dk>*{pointer-events:auto}
.dk-top{position:absolute;left:calc(var(--sl) + .16rem);right:calc(var(--sr) + .16rem);top:calc(var(--st) + .1rem);display:flex;align-items:center;gap:.2rem;pointer-events:none}
.dk-top>*{pointer-events:auto}
.dk-top h2{margin:0;font-size:.74rem;line-height:1;font-weight:900;color:#fff;-webkit-text-stroke:.11rem var(--ink);paint-order:stroke fill;text-shadow:0 .1rem 0 var(--ink)}
.dk-ip{font-weight:900;font-size:max(12px,.36rem);color:#fff1d6;background:rgba(40,20,10,.75);border:.04rem solid #ffae4a;border-radius:.3rem;padding:.06rem .2rem;animation:ipuc .4s ease-out}
.dk-top .chip{margin-left:auto}
.dk-uyari{position:absolute;left:50%;top:calc(var(--st) + 1.3rem);transform:translateX(-50%);display:flex;gap:.2rem;align-items:center;background:#ffd9d4;border:.06rem solid #b3140c;color:#8d140e;border-radius:.3rem;padding:.12rem .24rem;font-weight:800;font-size:.36rem;max-width:80%}
.dk-uyari .ic{width:.6rem;height:.6rem;flex:none}
.dk-kart{gap:.12rem;position:absolute;left:50%;top:calc(var(--st) + 1.25rem);width:min(10rem,calc(100% - var(--sl) - var(--sr) - 1rem));margin-left:max(-5rem,calc((100% - var(--sl) - var(--sr) - 1rem)/-2));display:grid;gap:.16rem;justify-items:center;background:linear-gradient(#fff7e6,#fbe9cc);border:.1rem solid #2e1a10;border-radius:.6rem;padding:.3rem .4rem .36rem;box-shadow:inset 0 0 0 .07rem #f3d29a,0 .2rem 0 rgba(0,0,0,.45),0 .4rem 1rem rgba(0,0,0,.35);text-align:center}
.dk-kart.gel{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.dk-kart .ust{display:flex;align-items:center;gap:.24rem;text-align:left}
.dk-kart .ust b{display:block;font-size:.56rem;font-weight:900;color:#9a1e10;line-height:1.05}
.dk-kart .ust small{font-size:.34rem;font-weight:800;color:#8a6d55}
.dk-kart .e{display:block;width:1.2rem;height:1.2rem}
.dk-kart .izr{display:grid;place-items:center;width:1.5rem;height:.95rem;border-radius:.2rem;background-size:cover;background-position:center;border:.05rem solid var(--ink);background-color:#4a3a34}
.dk-kart .izr.kil .ic{width:.6rem;height:.6rem}
.dk-kart p{margin:0;font-size:.4rem;font-weight:700;line-height:1.25;color:#5a4334}
.dk-kart .dd{display:flex;align-items:center;gap:.1rem;font-weight:900;font-size:.38rem;color:#8a6d55}.dk-kart .dd .ic{width:.5rem;height:.5rem}
.dk-kart .dd.tam{color:var(--green)}
.dk-kart .btn{width:auto;min-width:5rem;padding:.2rem .5rem}
.dk-kart .btn b{font-weight:900}
.dk-kart .btn[disabled]{background:#cfc4b4;color:#7a6a5a;box-shadow:0 .14rem 0 #9c8f80}
.dk-kart .dkx{position:absolute;right:-.2rem;top:-.2rem;width:max(44px,1.1rem);height:max(44px,1.1rem);border-radius:50%;display:grid;place-items:center}
.dk-kart .dkx .ic{width:55%;height:55%}
@media (prefers-reduced-motion:reduce){.yigin,.yigin .yg .pr,.isi i,.neonP,.lisik,.sil .gv,.sil .bs,.sil .kl,.etk,.etk.ok .kt,.radyo .ign,.radyo .nota i,.tepsi.hazir,.chip.gun.son{animation:none!important}.shopb.var,.shopb .rz,.mk.sira.ok .mb,.cevir .tel,.cevir .ok,.kepenk .sal,.mus .yuz,.mus,.balon,.balon.acil,.tbrz,.gk,.kabarcik i,.buhar i,.gk .duman,.hit.parla,.patsec,.hero .hb2,.hero .f,.parla,.mu,.mu *,svg .st,svg .sw,svg .tr,svg .hb,#ic .y.sec .al,#ic .y.parla .gor,#ic .goz .kor,#ic .goz.hazir .gor,#ic .fritoz .sepet,#ic .fritoz.hazir .gor,.home .isin,.stars span.dolu{animation:none!important}}
