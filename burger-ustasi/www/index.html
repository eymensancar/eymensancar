<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Burger Ustası</title><meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Burger Ustası 2.0: dikey dükkân oyunu. Yukarıdan aşağı: üst bilgi → gün çubuğu → sokak (3 müşteri) → tezgâh (ızgara, iki tabak, çöp) → malzeme tepsisi.
   Bütün ölçüler cqw (oyun alanı genişliğinin yüzdesi; alan en çok 540px). Mantık js/oyun.js içinde; burada yalnız düzen ve görünüm. */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1a12;font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
:root{--ink:#2a1a10;--cream:#fff4dc;--red:#d2281e;--red-d:#8d140e;--gold:#ffc21a;--green:#2e9d3e;--good:#37c25a;--good2:#8bff6a;--bad:#ff5b4f;--sky1:#8fd3ff;--sky2:#d9f3ff}
#app{position:relative;height:100dvh;width:min(100vw,540px,calc(100dvh/1.5));margin:0 auto;container-type:inline-size;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 40%,#e9c38a 40%,#d9a866);display:flex;flex-direction:column;color:var(--ink)}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{display:block;width:100%;height:100%;flex:none;overflow:visible}
/* ---------- üst bilgi ---------- */
.hud{position:relative;z-index:8;display:flex;align-items:center;gap:1.6cqw;padding:calc(env(safe-area-inset-top,0px) + 2cqw) 2.6cqw 1.4cqw}
.chip{display:flex;align-items:center;gap:1.2cqw;background:rgba(255,255,255,.94);border:.6cqw solid var(--ink);border-radius:5cqw;height:11.2cqw;padding:0 3cqw 0 1.2cqw;font-weight:900;font-size:5cqw;box-shadow:0 .8cqw 0 rgba(0,0,0,.2);line-height:1;white-space:nowrap}
.chip .ic{width:7.4cqw;height:7.4cqw}
.chip.kasa{min-width:24cqw}
.chip.kasa.neg span{color:var(--red)}
.chip.kasa.pop{animation:pulse .3s ease-out}
.chip.gun{padding:0 3cqw;font-size:4.4cqw}
.canlar{display:flex;gap:.2cqw;margin-left:auto}
.canlar span{width:7.6cqw;height:7.6cqw;transition:transform .3s,opacity .3s}
.canlar span.bos{opacity:.55;transform:scale(.85)}
.canlar span.gitti{animation:cangit .7s ease-out}
.hb{width:11.2cqw;height:11.2cqw;border-radius:50%;background:rgba(255,255,255,.94);border:.6cqw solid var(--ink);box-shadow:0 .8cqw 0 rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
.hb .ic{width:7cqw;height:7cqw}
.hb:active{transform:translateY(.6cqw);box-shadow:0 .2cqw 0 rgba(0,0,0,.2)}
.prog{position:relative;z-index:8;margin:0 3cqw;height:2.4cqw;border-radius:2cqw;background:rgba(0,0,0,.2);overflow:hidden;flex:none}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff9d1a);border-radius:2cqw;transition:width .4s}
/* ---------- sokak ve müşteriler ---------- */
.street{position:relative;flex:1 1 auto;min-height:56cqw;z-index:3}
.street::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#f3d9a6,#e2b877);border-top:1cqw solid #c79a55}
.street::after{content:"";position:absolute;left:0;right:0;bottom:34%;height:34%;background:linear-gradient(90deg,#b9dff5 0 12%,#a6d2ee 12% 30%,#c4e6f8 30% 47%,#9fcdea 47% 66%,#bfe2f6 66% 83%,#abd6f0 83%);clip-path:polygon(0 40%,12% 40%,12% 10%,30% 10%,30% 55%,47% 55%,47% 0,66% 0,66% 35%,83% 35%,83% 20%,100% 20%,100% 100%,0 100%);opacity:.7}
.awning{position:absolute;left:-4cqw;right:-4cqw;top:-3cqw;z-index:1;pointer-events:none}
.awning img{width:100%;height:20cqw;object-fit:fill}
.queue{position:absolute;z-index:2;left:0;right:0;top:0;bottom:-6cqw;display:grid;grid-template-columns:repeat(3,1fr);padding:0 1cqw}
.slot{position:relative;height:100%}
.cust{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;transform:translateY(70%);opacity:0;transition:transform .5s cubic-bezier(.2,1.25,.4,1),opacity .25s}
.cust.in{transform:none;opacity:1}
.cust.out{transform:translateY(80%);opacity:0;transition:transform .45s ease-in,opacity .45s ease-in}
.cust .yuz{width:var(--yz,27cqw);aspect-ratio:128/154;transform-origin:50% 100%;filter:drop-shadow(0 1cqw .6cqw rgba(0,0,0,.25));transition:transform .2s}
.yuz svg,.hero .f svg{width:100%;height:100%;display:block}
.bub{position:relative;width:31cqw;background:#fff;border:.7cqw solid var(--ink);border-radius:4cqw;padding:1.4cqw 1.4cqw 1.6cqw;margin-bottom:2cqw;display:flex;flex-direction:column;align-items:center;gap:1.2cqw;box-shadow:0 1cqw 0 rgba(0,0,0,.15);transition:transform .18s,box-shadow .18s,border-color .18s}
.bub::after{content:"";position:absolute;left:50%;bottom:-2.2cqw;width:3cqw;height:3cqw;background:#fff;border-right:.7cqw solid var(--ink);border-bottom:.7cqw solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bub .sip{width:100%;display:flex;justify-content:center}
.sabir{width:100%;height:2.2cqw;border-radius:2cqw;background:#e9e1d4;box-shadow:inset 0 .3cqw 0 rgba(0,0,0,.12);overflow:hidden}
.sabir b{display:block;height:100%;width:100%;border-radius:2cqw;background:#3cc45a;box-shadow:inset 0 .5cqw 0 rgba(255,255,255,.35)}
.cust.hedef .bub{transform:scale(1.06);border-color:#e8a400;box-shadow:0 0 0 1.2cqw rgba(255,194,26,.75),0 1cqw 0 rgba(0,0,0,.15)}
.cust.hedef .yuz{transform:scale(1.06) translateY(-1cqw)}
.cust.kizgin .yuz{filter:drop-shadow(0 0 1.2cqw rgba(230,40,30,.55)) drop-shadow(0 1cqw .6cqw rgba(0,0,0,.25))}
.cust.mutlu-git .yuz{animation:hop .45s ease-out 2}
.cust.kizgin-git .yuz{animation:shake .3s linear 3}
.cust.cik .bub{opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
/* müşteri yüzleri (www/musteri.js): duygu animasyonları */
@keyframes mu-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mu-tap{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes mu-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes mu-sink{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes mu-rise{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
@keyframes mu-drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes mu-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes mu-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mu{transform-box:view-box;transform-origin:60px 140px}
.m-happy{animation:mu-hop 1s ease-in-out infinite}.m-wait{animation:mu-sink 2.6s ease-in-out infinite}.m-imp{animation:mu-tap .5s ease-in-out infinite}
.m-angry{animation:mu-shake .22s linear infinite}.m-love{animation:mu-hop .8s ease-in-out infinite}.m-sad{animation:mu-sink 3s ease-in-out infinite}
.mu .blink{animation:mu-blink 4s infinite;transform-box:fill-box;transform-origin:center}
svg .st{animation:mu-rise 1.1s ease-out infinite}svg .st.d2{animation-delay:.37s}svg .st.d3{animation-delay:.74s}
svg .sw,svg .tr{animation:mu-drip 1.3s ease-in infinite}svg .hb{animation:mu-pulse .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
/* ---------- tezgâh ---------- */
.counter{position:relative;z-index:4;flex:none;height:52cqw;background:linear-gradient(#b17a2c,#8a5a1c 55%,#6d4410);border-top:1.4cqw solid #4a2c08;box-shadow:inset 0 2cqw 0 rgba(255,255,255,.12),0 -1cqw 2cqw rgba(0,0,0,.18);display:grid;grid-template-columns:22cqw 1fr 1fr 15cqw;gap:1cqw;align-items:center;padding:1.4cqw 2cqw}
.counter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 10cqw,rgba(0,0,0,.08) 10cqw 10.6cqw);pointer-events:none}
.grill{position:relative;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:1.2cqw;background:#3a3d44;border:.8cqw solid #17181c;border-radius:4cqw;padding:1.4cqw 1.2cqw;box-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.grill small{font-size:2.8cqw;font-weight:800;color:#ffd9a8;letter-spacing:.06em;text-transform:uppercase;line-height:1;text-align:center}
.gs{position:relative;width:100%;flex:1 1 0;max-height:17cqw;min-height:13.8cqw;border-radius:3cqw;background:repeating-linear-gradient(90deg,#1c1d21 0 1.2cqw,#55585f 1.2cqw 2.1cqw);display:grid;place-items:center;box-shadow:inset 0 0 0 .6cqw #0d0e10;touch-action:manipulation}
.gs::before{content:"";position:absolute;inset:-1cqw}
.gs .art{width:9cqw;height:9cqw;opacity:.5}
.gs .art .ic{width:100%;height:100%}
.gs .kof{width:13cqw;height:13cqw;position:relative}
.gs .kof img{width:100%;height:100%}
.gs.cig .kof{animation:sizzle .22s linear infinite}
.gs.cig .kof img.pis{position:absolute;inset:0;opacity:var(--pis,0)}
.gs.hazir{box-shadow:inset 0 0 0 .6cqw #0d0e10,0 0 0 .9cqw var(--gold);animation:pulse .6s ease-in-out infinite}
.gs .halka{position:absolute;left:1.2cqw;right:1.2cqw;bottom:.9cqw;height:1.3cqw;border-radius:1cqw;background:rgba(0,0,0,.55);overflow:hidden}
.gs .halka b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#7be06a)}
.gs .duman{position:absolute;top:-1cqw;width:3cqw;height:3cqw;border-radius:50%;background:rgba(255,255,255,.7);animation:smoke 1s ease-out infinite;pointer-events:none}
.gs .duman.d2{left:60%;animation-delay:.5s}.gs .duman.d1{left:30%}
.gs:active{transform:translateY(.5cqw) scale(.98)}
.tabak{position:relative;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;border-radius:4cqw;cursor:pointer}
.tabak .tno{position:absolute;top:.6cqw;left:50%;transform:translateX(-50%);font-size:2.6cqw;font-weight:800;color:rgba(255,236,200,.75);letter-spacing:.05em;text-transform:uppercase;line-height:1;white-space:nowrap}
.tabak .tab{position:absolute;left:0;right:0;bottom:1.4cqw;height:11cqw;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,#fff 0 46%,#e7e3da 47% 62%,#fff 63%);box-shadow:0 1.2cqw 0 rgba(0,0,0,.28),inset 0 0 0 .6cqw #cfc8ba;transition:box-shadow .2s}
.tabak .yig{position:relative;z-index:1;width:23cqw;margin-bottom:5cqw;display:flex;justify-content:center;align-items:flex-end;transform-origin:50% 100%}
.tabak .yig.bump{animation:squash .28s ease-out}
.tabak.tasiniyor .yig{opacity:.18;filter:grayscale(1)}
.tabak.secili .tab{box-shadow:0 1.2cqw 0 rgba(0,0,0,.28),inset 0 0 0 .6cqw #cfc8ba,0 0 0 .9cqw rgba(255,214,90,.55)}
.tabak .bu-yigin .bu-yeni{animation:dusus .32s cubic-bezier(.25,1.45,.45,1) .12s backwards}
.cop{position:relative;justify-self:center;width:14.6cqw;height:19cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;border-radius:3.6cqw;background:#e9e4da;border:.8cqw solid var(--ink);box-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.cop .ic{width:10cqw;height:10cqw}
.cop small{font-size:2.6cqw;font-weight:800;color:#6a5646;line-height:1}
.cop.hedef{background:#ffe08a;transform:scale(1.1);box-shadow:0 0 0 1cqw rgba(255,194,26,.7),0 1cqw 0 rgba(0,0,0,.3)}
.cop.yut{animation:yut .4s ease-out}
/* ---------- malzeme tepsisi ---------- */
.tray{position:relative;z-index:6;flex:none;background:#3a2412;border-top:1.2cqw solid #1f1208;padding:2.2cqw 2cqw calc(env(safe-area-inset-bottom,0px) + 2.4cqw);display:flex;flex-wrap:wrap;justify-content:center;gap:2cqw 1.6cqw}
.ing{position:relative;width:17.6cqw;height:16cqw;border-radius:3.6cqw;background:var(--cream);border:.7cqw solid var(--ink);box-shadow:0 1.1cqw 0 #170d05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;transition:transform .12s,box-shadow .12s,background .15s;touch-action:manipulation}
.ing .im{width:10.6cqw;height:10.6cqw;display:grid;place-items:center;transition:opacity .15s,transform .15s}
.ing .im>*{width:100%;height:100%;max-width:100%;max-height:100%}
.ing .im img,.ing .im svg{width:100%;height:100%;object-fit:contain}
.ing .ad{font-size:2.6cqw;font-weight:800;line-height:1;color:#6a5040;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ing .al{position:absolute;left:50%;top:1.2cqw;width:10.6cqw;height:10.6cqw;margin-left:-5.3cqw;pointer-events:none;opacity:0;z-index:3}
.ing .al .im2{width:100%;height:100%}
.ing .al .im2>*,.ing .al img,.ing .al svg{width:100%;height:100%;object-fit:contain}
.ing .gol{position:absolute;left:50%;top:9.4cqw;width:9cqw;height:2.4cqw;margin-left:-4.5cqw;border-radius:50%;background:rgba(40,20,5,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:scale(.6)}
.ing.sec{background:#fff8e2;transform:translateY(.8cqw);box-shadow:0 .3cqw 0 #170d05,0 0 0 1cqw var(--gold),inset 0 0 2cqw rgba(255,194,26,.5);border-color:#7a4a00;z-index:4}
.ing.sec .im{opacity:.28;transform:scale(.9)}
.ing.sec .gol{opacity:1;transform:scale(1)}
.ing.sec .al{opacity:1;animation:avucla .26s cubic-bezier(.2,1.5,.4,1) forwards,salin 1.6s ease-in-out .26s infinite}
.ing.sec .al .im2{filter:drop-shadow(0 1.6cqw 1cqw rgba(0,0,0,.4))}
.ing:active:not(.kilit){transform:translateY(.8cqw);box-shadow:0 .3cqw 0 #170d05}
.ing.sec:active{box-shadow:0 .3cqw 0 #170d05,0 0 0 1cqw var(--gold)}
.ing.kilit{background:#6b5a4b;cursor:default}
.ing.kilit .im{filter:brightness(0) opacity(.28)}
.ing.kilit .ad{color:#f3e3cf;display:flex;align-items:center;gap:.6cqw}
.ing.kilit .ad .ic{width:3.2cqw;height:3.2cqw}
.ing.yeni-m::before{content:attr(data-yeni);position:absolute;top:-2.2cqw;right:-1.4cqw;background:var(--red);color:#fff;font-size:2.6cqw;font-weight:900;padding:.5cqw 1.6cqw;border-radius:2cqw;transform:rotate(8deg);z-index:5;border:.4cqw solid var(--ink)}
.ing .rozet{position:absolute;right:-1.8cqw;top:-1.8cqw;min-width:6.8cqw;height:6.8cqw;padding:0 1.2cqw;border-radius:4cqw;background:var(--red);color:#fff;font-size:3.8cqw;font-weight:900;display:grid;place-items:center;border:.6cqw solid var(--ink);line-height:1;z-index:5}
.ing.bos .im{opacity:.3;filter:grayscale(.7)}
.ing.bos .rozet{background:#9c8f80}
.ing.bos.sec .al{opacity:.35}
.ing .rozet.pop{animation:rozet .35s cubic-bezier(.2,1.6,.4,1)}
.ing.dolu-gel{animation:pulse .3s ease-out}
/* ---------- efekt katmanı ---------- */
#fx{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.ucan{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.ucan.kof{width:11cqw;height:11cqw}
.ucan.kof img,.ucan.kof svg,.ucan.mal>*{width:100%;height:100%}
.ucan.mal{width:10cqw;height:10cqw;filter:drop-shadow(0 1.4cqw 1cqw rgba(0,0,0,.35))}
.hayalet{position:absolute;left:0;top:0;width:23cqw;pointer-events:none;will-change:transform;z-index:22}
.hayalet .gov{transform-origin:50% 100%;transform:scale(1.1) rotate(-3deg);filter:drop-shadow(0 3cqw 2cqw rgba(0,0,0,.4));display:flex;justify-content:center;align-items:flex-end;animation:kalk .18s ease-out}
.yazi{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.8cqw;font-weight:900;font-size:6.6cqw;line-height:1;color:#fff;-webkit-text-stroke:.6cqw var(--ink);paint-order:stroke fill;white-space:nowrap;animation:yaz 1.15s ease-out forwards;pointer-events:none}
.yazi .ic{width:6.6cqw;height:6.6cqw}
.yazi.iyi{color:var(--good)}
.yazi.bahsis{color:var(--good2);font-size:5.6cqw;flex-direction:column;gap:0;animation-duration:1.3s}
.yazi.bahsis .s{display:flex;align-items:center;gap:.8cqw}
.yazi.bahsis small{font-size:3.2cqw;-webkit-text-stroke:.45cqw var(--ink);letter-spacing:.04em}
.yazi.kotu{color:var(--bad)}
.yazi.mini{font-size:3.8cqw;-webkit-text-stroke:.45cqw var(--ink);color:#ff8a7a;animation:mini .6s ease-out forwards}
.yazi.mini .ic{width:3.8cqw;height:3.8cqw}
.uyari{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-weight:800;font-size:3.9cqw;padding:1.3cqw 3.2cqw;border-radius:5cqw;white-space:nowrap;box-shadow:0 1cqw 0 rgba(0,0,0,.25);animation:uyar 1.3s ease-out forwards;pointer-events:none}
.ipucu{position:absolute;left:0;top:0;z-index:24;display:flex;align-items:center;gap:1.4cqw;background:var(--ink);color:#fff;font-weight:800;font-size:4cqw;line-height:1.1;padding:1.4cqw 3.4cqw 1.4cqw 1.6cqw;border-radius:5cqw;white-space:nowrap;box-shadow:0 1cqw 0 rgba(0,0,0,.25);pointer-events:none;animation:ipuc .25s ease-out}
.ipucu .ic{width:6cqw;height:6cqw}
.ipucu::after{content:"";position:absolute;left:var(--ok,50%);bottom:-1.6cqw;width:3cqw;height:3cqw;margin-left:-1.5cqw;background:var(--ink);transform:rotate(45deg)}
.ipucu.alt::after{bottom:auto;top:-1.6cqw}
.el{position:absolute;left:0;top:0;width:12cqw;height:12cqw;z-index:25;pointer-events:none;filter:drop-shadow(0 1cqw .8cqw rgba(0,0,0,.35))}
.parla{animation:parla .8s ease-in-out infinite!important;z-index:7}
.tabak.parla{animation:parlaT .8s ease-in-out infinite!important}
/* ---------- katmanlar (kartlar) ---------- */
.ov{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(30,16,8,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:calc(env(safe-area-inset-top,0px) + 4cqw) 6cqw calc(env(safe-area-inset-bottom,0px) + 4cqw);animation:fade .25s;overflow:auto}
.card{width:100%;background:var(--cream);border:1cqw solid var(--ink);border-radius:7cqw;padding:5.4cqw 5cqw 5cqw;text-align:center;box-shadow:0 2cqw 0 rgba(0,0,0,.4);display:grid;gap:2.8cqw;justify-items:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.card h2{margin:0;font-size:8.4cqw;line-height:1;font-weight:900;color:var(--red-d)}
.card p{margin:0;font-size:4.4cqw;font-weight:700;line-height:1.3;color:#5a4334}
.btn{width:100%;min-height:13cqw;display:flex;align-items:center;justify-content:center;gap:2cqw;background:var(--red);color:#fff;font-weight:900;font-size:6cqw;padding:2.6cqw;border-radius:5cqw;border:.8cqw solid var(--ink);box-shadow:0 1.4cqw 0 var(--red-d);line-height:1}
.btn .ic{width:6.4cqw;height:6.4cqw}
.btn:active{transform:translateY(1cqw);box-shadow:0 .4cqw 0 var(--red-d)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 1.4cqw 0 #b9ad9c;font-size:4.8cqw}
.btns{width:100%;display:grid;gap:3cqw;margin-top:1cqw}
.stars{display:flex;gap:1cqw;align-items:flex-end}
.stars span{width:17cqw;height:17cqw;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.stars span:nth-child(2){animation-delay:.18s;width:20cqw;height:20cqw}.stars span:nth-child(3){animation-delay:.36s}
.tablo{width:100%;display:grid;gap:1.2cqw;font-size:4.4cqw;font-weight:800}
.tablo .r{display:flex;align-items:center;justify-content:space-between;background:#fff;border:.5cqw solid #e2d3b8;border-radius:3cqw;padding:1.6cqw 3cqw}
.tablo .r b{display:flex;align-items:center;gap:1cqw;font-weight:900}
.tablo .r b .ic{width:5cqw;height:5cqw}
.tablo .r.net{background:#fff3c4;border-color:#e8c25a;font-size:5cqw}
.tablo .pos{color:var(--green)}.tablo .neg{color:var(--red)}
.yuzler{display:flex;justify-content:center;gap:3cqw;width:100%}
.yuzler span{display:flex;align-items:center;gap:1.2cqw;font-weight:900;font-size:5cqw;background:#fff;border:.5cqw solid #e2d3b8;border-radius:4cqw;padding:1cqw 2.6cqw 1cqw 1.2cqw}
.yuzler .ic{width:7cqw;height:7cqw}
.newing{display:flex;align-items:center;gap:3cqw;background:#fff;border:.7cqw solid var(--ink);border-radius:5cqw;padding:2cqw 4cqw 2cqw 2cqw;font-weight:900;font-size:4.6cqw;text-align:left;line-height:1.15}
.newing .im{width:15cqw;height:15cqw}
.newing .im>*{width:100%;height:100%}
.info{display:flex;gap:3cqw;justify-content:center;flex-wrap:wrap}
.info span{display:flex;align-items:center;gap:1.2cqw;font-weight:900;font-size:4.6cqw;background:#fff;border-radius:4cqw;padding:1cqw 3cqw 1cqw 1.4cqw;border:.5cqw solid #e2d3b8}
.info .ic{width:6cqw;height:6cqw}
.ayarlar{display:flex;gap:3cqw;justify-content:center}
.tg{display:flex;align-items:center;gap:1.6cqw;min-height:12cqw;padding:0 3.4cqw 0 2cqw;border-radius:5cqw;background:#fff;border:.7cqw solid var(--ink);font-weight:900;font-size:4.2cqw;box-shadow:0 1cqw 0 #b9ad9c}
.tg .ic{width:7cqw;height:7cqw}
.tg.kapali{opacity:.6;background:#e6ddd0}
/* ---------- ana ekran ---------- */
.home{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#ffcf5a,#ff9a3c 55%,#e2562a);padding:calc(env(safe-area-inset-top,0px) + 3cqw) 5cqw calc(env(safe-area-inset-bottom,0px) + 3cqw);overflow:hidden}
.home .top{width:100%;display:flex;align-items:center;gap:2cqw}
.home .top .chip{margin-right:auto}
.home .hb.kapali{opacity:.55}
.home .lang{display:flex;align-items:center;gap:1cqw;height:11.2cqw;min-width:11.2cqw;padding:0 2.6cqw 0 1.4cqw;border-radius:6cqw;background:rgba(255,255,255,.94);border:.6cqw solid var(--ink);box-shadow:0 .8cqw 0 rgba(0,0,0,.2);font-weight:900;font-size:4cqw}
.home .lang .ic{width:6.4cqw;height:6.4cqw}
.logo{margin-top:3cqw;text-align:center;line-height:.86;font-weight:900;color:#fff;-webkit-text-stroke:1.6cqw var(--ink);paint-order:stroke fill;font-size:16cqw;transform:rotate(-4deg);text-shadow:0 1.6cqw 0 var(--ink)}
.logo small{display:block;font-size:10.5cqw;color:var(--gold)}
.hero{position:relative;flex:1 1 auto;width:100%;min-height:34cqw;display:grid;place-items:center}
.hero .hb2{width:40cqw;display:flex;justify-content:center;align-items:flex-end;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 3cqw 1.5cqw rgba(0,0,0,.3))}
.hero .f{position:absolute;width:24cqw;aspect-ratio:128/154;animation:bob 1.8s ease-in-out infinite}
.hero .f1{left:0;bottom:2cqw;animation-delay:.3s}.hero .f2{right:0;bottom:5cqw;animation-delay:.7s}
.home .btn.oyna{font-size:7.6cqw;min-height:17cqw}
.ups{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;margin-top:3.4cqw}
.up{position:relative;display:grid;grid-template-columns:11cqw 1fr;grid-template-rows:auto auto auto;column-gap:2cqw;align-items:center;text-align:left;background:var(--cream);border:.7cqw solid var(--ink);border-radius:4.5cqw;padding:2cqw 2cqw 2cqw 2cqw;box-shadow:0 1.1cqw 0 rgba(0,0,0,.3);line-height:1.05;min-height:19cqw}
.up:active{transform:translateY(.8cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.3)}
.up .e{grid-row:1/4;width:11cqw;height:11cqw}
.up b{font-size:3.5cqw;font-weight:900}
.up small{font-size:2.7cqw;font-weight:800;color:#8a6d55}
.up .pips{display:flex;gap:.8cqw;margin:.6cqw 0}
.up .pips i{width:2.6cqw;height:1.4cqw;border-radius:1cqw;background:#dccdb6}
.up .pips i.on{background:var(--green)}
.up .c{position:absolute;right:1.6cqw;top:-2.4cqw;display:flex;align-items:center;gap:.6cqw;font-size:3.5cqw;font-weight:900;background:var(--gold);border-radius:3cqw;padding:.6cqw 2cqw .6cqw .8cqw;border:.5cqw solid var(--ink);white-space:nowrap}
.up .c .ic{width:4.2cqw;height:4.2cqw}
.up.no .c{background:#d8cfc2;color:#8a7c6c}.up.max .c{background:var(--green);color:#fff;padding-left:2cqw}
.up.kilit{background:#e2d6c4}.up.kilit .e{opacity:.4}.up.kilit .c{background:#6b5a4b;color:#fff}
.up.aldi{animation:pulse .35s ease-out}
.credit{margin-top:2.4cqw;font-size:2.7cqw;font-weight:700;color:rgba(40,20,8,.75);text-align:center;line-height:1.3}
@keyframes bob{50%{transform:translateY(-1.4cqw) scale(1.02,.98)}}
@keyframes hop{50%{transform:translateY(-6cqw) scale(.95,1.08)}}
@keyframes shake{25%{transform:translateX(-1.6cqw) rotate(-5deg)}75%{transform:translateX(1.6cqw) rotate(5deg)}}
@keyframes sizzle{50%{transform:translate(.25cqw,-.25cqw)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes rozet{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes smoke{from{opacity:.8;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-6cqw) scale(1.5)}}
@keyframes dusus{0%{transform:translateY(-14cqw) scale(1.12) rotate(-4deg);opacity:.6}70%{transform:translateY(.6cqw) scale(1.04,.94)}100%{transform:none;opacity:1}}
@keyframes squash{0%{transform:none}35%{transform:scale(1.06,.93)}70%{transform:scale(.98,1.03)}100%{transform:none}}
@keyframes avucla{0%{transform:translateY(0) scale(1) rotate(0)}100%{transform:translateY(-6.5cqw) scale(1.2) rotate(-9deg)}}
@keyframes salin{0%,100%{transform:translateY(-6.5cqw) scale(1.2) rotate(-9deg)}50%{transform:translateY(-7.6cqw) scale(1.22) rotate(-5deg)}}
@keyframes kalk{from{transform:scale(1) rotate(0)}}
@keyframes yut{30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}}
@keyframes cangit{0%{transform:scale(1.6)}40%{transform:scale(.6) rotate(-20deg)}100%{transform:scale(.85)}}
@keyframes yaz{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}30%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%)}}
@keyframes mini{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%)}}
@keyframes uyar{0%{opacity:0;transform:translate(-50%,-80%) scale(.7)}12%{opacity:1;transform:translate(-50%,-110%) scale(1.05)}20%{transform:translate(-50%,-105%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%)}}
@keyframes ipuc{from{opacity:0;margin-top:1.5cqw}}
@keyframes parla{0%,100%{box-shadow:0 0 0 .6cqw var(--gold),0 1cqw 0 rgba(0,0,0,.3)}50%{box-shadow:0 0 0 1.8cqw rgba(255,194,26,.85),0 1cqw 0 rgba(0,0,0,.3)}}
@keyframes parlaT{0%,100%{background:rgba(255,214,90,.12)}50%{background:rgba(255,214,90,.45)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.cust .yuz,.hero .hb2,.hero .f,.parla,.gs.hazir,.mu,.mu *,svg .st,svg .sw,svg .tr,svg .hb,.ing.sec .al{animation:none!important}}
</style></head><body>
