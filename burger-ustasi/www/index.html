<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Burger Ustası</title><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Burger Ustası 2.0: dikey dükkân oyunu. Yukarıdan aşağı: üst bilgi → gün çubuğu → sokak (3 müşteri, tezgâh pervazının arkasında) → tezgâh (ızgara, iki tabak kesme tahtası üstünde, çöp) → malzeme tepsisi.
   Bütün ölçüler cqw (oyun alanı genişliğinin yüzdesi; alan en çok 540px, en az 1,6 oranında). Mantık js/oyun.js içinde; burada yalnız düzen ve görünüm. */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1a12;font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
:root{--ink:#2a1a10;--cream:#fff4dc;--red:#d2281e;--red-d:#8d140e;--gold:#ffc21a;--green:#2e9d3e;--good:#37c25a;--good2:#8bff6a;--bad:#ff5b4f;--sky1:#8fd3ff;--sky2:#d9f3ff}
#app{position:relative;height:100dvh;width:min(100vw,540px,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))/1.6));margin:0 auto;container-type:inline-size;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 40%,#e9c38a 40%,#d9a866);display:flex;flex-direction:column;color:var(--ink);touch-action:none}
#app.sars{animation:sars .22s linear}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{display:block;width:100%;height:100%;flex:none;overflow:visible}
/* ---------- üst bilgi ---------- */
.hud{position:relative;z-index:8;display:flex;align-items:center;gap:1cqw;padding:calc(env(safe-area-inset-top,0px) + 2cqw) 2cqw 1.4cqw}
.chip{display:flex;align-items:center;gap:1.2cqw;background:rgba(255,255,255,.94);border:.6cqw solid var(--ink);border-radius:5cqw;height:11.2cqw;padding:0 2.4cqw 0 1cqw;font-weight:900;font-size:4.6cqw;box-shadow:0 .8cqw 0 rgba(0,0,0,.2);line-height:1;white-space:nowrap}
.chip .ic{width:7.4cqw;height:7.4cqw}
.chip.kasa{min-width:min-content;flex:0 0 auto;font-variant-numeric:tabular-nums}
.chip.kasa.neg span{color:var(--red)}
.chip.kasa.pop{animation:kpop .3s ease-out}
.chip.kasa .i{transition:transform .12s}
.chip.kasa.tik .i{transform:scale(1.25) rotate(-12deg)}
.chip.gun{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 2.4cqw;font-size:4.4cqw}
.canlar{display:flex;gap:.2cqw;margin-left:auto;flex:none}
.canlar span{width:6.8cqw;height:6.8cqw;transition:transform .3s,opacity .3s}
.canlar span.bos{opacity:.55;transform:scale(.85)}
.canlar span.gitti{animation:cangit .7s ease-out}
.hb{position:relative;width:11.2cqw;height:11.2cqw;border-radius:50%;background:rgba(255,255,255,.94);border:.6cqw solid var(--ink);box-shadow:0 .8cqw 0 rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
.hb .ic{width:7cqw;height:7cqw}
.hb:active{transform:translateY(.6cqw);box-shadow:0 .2cqw 0 rgba(0,0,0,.2)}
.hb::before,.home .lang::before{content:"";position:absolute;inset:min(0px,calc((11.2cqw - 44px)/2))}
.prog{position:relative;z-index:8;margin:0 3cqw;height:3cqw;border-radius:2cqw;background:#fff;border:.5cqw solid var(--ink);box-shadow:0 .6cqw 0 rgba(0,0,0,.2);overflow:hidden;flex:none}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff9d1a);border-radius:2cqw;transition:width .4s}
/* ---------- sokak ve müşteriler ---------- */
.street{position:relative;flex:1.4 1 50cqw;min-height:var(--stmin,50cqw);z-index:3;margin-top:-3cqw}
.sahne{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sahne svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sahne .bulut{animation:bulut 70s linear infinite alternate}
.sahne .bulut.b2{animation-duration:95s;animation-direction:alternate-reverse}
.awning{position:absolute;left:-4cqw;right:-4cqw;top:0;z-index:1;pointer-events:none}
.awning img{width:100%;height:20cqw;object-fit:fill}
.direk{position:absolute;z-index:1;top:12cqw;bottom:3cqw;width:2.2cqw;border-radius:1cqw;background:linear-gradient(90deg,#7a4a1c,#c98b4a 45%,#7a4a1c);border:.4cqw solid var(--ink);pointer-events:none}
.direk.d1{left:1.4cqw}.direk.d2{right:1.4cqw}
.pervaz{position:absolute;z-index:3;left:0;right:0;bottom:0;height:5cqw;background:linear-gradient(#d8964a,#b26f2c 45%,#8a5220);border-top:1cqw solid #f0b46a;box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.18),0 -.6cqw 1cqw rgba(0,0,0,.18);pointer-events:none}
.pervaz::after{content:"";position:absolute;inset:1.1cqw 0 auto;height:.5cqw;background:repeating-linear-gradient(90deg,rgba(80,40,10,.35) 0 18cqw,transparent 18cqw 20cqw)}
.queue{position:absolute;z-index:2;left:0;right:0;top:3cqw;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);padding:0 1cqw}
.slot{position:relative;height:100%}
.cust{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;transform:translateY(70%);opacity:0;transition:transform .5s cubic-bezier(.2,1.25,.4,1),opacity .25s}
.cust.in{transform:none;opacity:1}
.cust.out{transform:translateY(80%);opacity:0;transition:transform .45s ease-in,opacity .45s ease-in}
.cust .yuz{width:var(--yz,27cqw);aspect-ratio:128/154;transform-origin:50% 100%;filter:drop-shadow(0 1cqw .6cqw rgba(0,0,0,.25));transition:transform .2s}
.yuz svg,.hero .f svg,.mf svg{width:100%;height:100%;display:block}
.bub{position:relative;width:30cqw;background:#fff;border:.7cqw solid var(--ink);border-radius:4cqw;padding:1.2cqw 1.2cqw 1.4cqw;margin-bottom:2cqw;display:flex;flex-direction:column;align-items:center;gap:1cqw;box-shadow:0 1cqw 0 rgba(0,0,0,.15);transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.bub::after{content:"";position:absolute;left:50%;bottom:-2.2cqw;width:3cqw;height:3cqw;background:inherit;border-right:.7cqw solid var(--ink);border-bottom:.7cqw solid var(--ink);border-color:inherit;border-top-color:transparent;border-left-color:transparent;transform:translateX(-50%) rotate(45deg)}
.bub .sip{width:100%;display:flex;justify-content:center}
.sabir{width:100%;height:2.2cqw;border-radius:2cqw;background:#e9e1d4;box-shadow:inset 0 .3cqw 0 rgba(0,0,0,.12);overflow:hidden}
.sabir b{display:block;height:100%;width:100%;border-radius:2cqw;background:#3cc45a;box-shadow:inset 0 .5cqw 0 rgba(255,255,255,.35)}
.cust.hedef .bub{transform:scale(1.06);border-color:#e8a400;box-shadow:0 0 0 1.2cqw rgba(255,194,26,.75),0 1cqw 0 rgba(0,0,0,.15)}
.cust.hedef .yuz{transform:scale(1.08) translateY(-1cqw)}
.cust.kizgin .yuz{filter:drop-shadow(0 0 1.2cqw rgba(230,40,30,.55)) drop-shadow(0 1cqw .6cqw rgba(0,0,0,.25))}
.cust.mutlu-git .yuz{animation:hop .45s ease-out 2}
.cust.kizgin-git .yuz{animation:shake .3s linear 3}
.cust.ret .bub{background:#ffd9d4;border-color:#b3140c;animation:shake .26s linear 2}
.cust.cik .bub{opacity:0;transform:scale(.6);transition:opacity .2s .25s,transform .2s .25s}
/* müşteri yüzleri (www/musteri.js): duygu animasyonları */
@keyframes mu-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mu-tap{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes mu-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes mu-sink{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes mu-rise{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
@keyframes mu-drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes mu-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes mu-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mu{transform-box:view-box;transform-origin:60px 140px}
.m-happy{animation:mu-hop 1s ease-in-out infinite}.m-wait{animation:mu-sink 2.6s ease-in-out infinite}.m-imp{animation:mu-tap .5s ease-in-out infinite}
.m-angry{animation:mu-shake .22s linear infinite}.m-love{animation:mu-hop .8s ease-in-out infinite}.m-sad{animation:mu-sink 3s ease-in-out infinite}
.mu .blink{animation:mu-blink 4s infinite;transform-box:fill-box;transform-origin:center}
svg .st{animation:mu-rise 1.1s ease-out infinite}svg .st.d2{animation-delay:.37s}svg .st.d3{animation-delay:.74s}
svg .sw,svg .tr{animation:mu-drip 1.3s ease-in infinite}svg .hb{animation:mu-pulse .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
/* ---------- tezgâh ---------- */
.counter{position:relative;z-index:4;flex:1 1 48cqw;min-height:46cqw;max-height:64cqw;background:linear-gradient(#b17a2c,#8a5a1c 55%,#6d4410);border-top:1.4cqw solid #4a2c08;box-shadow:inset 0 2cqw 0 rgba(255,255,255,.12),0 -1cqw 2cqw rgba(0,0,0,.18);display:grid;grid-template-columns:19cqw 1fr 1fr 13cqw;gap:.6cqw;align-items:center;padding:4.4cqw 2cqw 2.4cqw}
.counter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 10cqw,rgba(0,0,0,.07) 10cqw 10.6cqw),repeating-linear-gradient(90deg,transparent 0 33cqw,rgba(0,0,0,.05) 33cqw 33.5cqw);pointer-events:none}
/* arka duvar şeridi: fayans */
.counter::after{content:"";position:absolute;left:0;right:0;top:0;height:3cqw;background:linear-gradient(rgba(0,0,0,.0) 80%,rgba(0,0,0,.18)),repeating-linear-gradient(90deg,#fffaf0 0 6.2cqw,#d9cdb8 6.2cqw 6.6cqw),#fffaf0;border-bottom:.6cqw solid #4a2c08;pointer-events:none}
.grill{position:relative;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:1.2cqw;background:linear-gradient(#4a4d55,#33363c);border:.8cqw solid #17181c;border-radius:4cqw;padding:1.4cqw 1.2cqw;box-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.grill small{font-size:max(10px,2.8cqw);font-weight:800;color:#ffd9a8;letter-spacing:.06em;text-transform:uppercase;line-height:1;text-align:center}
.gs{position:relative;width:100%;flex:1 1 0;max-height:20cqw;min-height:13.8cqw;border-radius:3cqw;background:repeating-linear-gradient(90deg,#1c1d21 0 1.2cqw,#55585f 1.2cqw 2.1cqw);display:grid;place-items:center;box-shadow:inset 0 0 0 .6cqw #0d0e10;touch-action:manipulation;transition:box-shadow .4s}
.gs::before{content:"";position:absolute;inset:-1cqw}
.gs .sil{width:12cqw;height:12cqw;opacity:.22;filter:brightness(0) invert(1)}
.gs .sil img{width:100%;height:100%}
.gs .kof{width:12.4cqw;height:12.4cqw;position:relative;z-index:2}
.gs .kof img{width:100%;height:100%}
.gs .kof img.pis{position:absolute;inset:0;opacity:var(--pis,0)}
.gs.cig{box-shadow:inset 0 0 0 .6cqw #0d0e10,inset 0 -3cqw 4cqw rgba(255,110,20,.75),inset 0 0 6cqw rgba(255,80,0,.35);animation:kor 1.1s ease-in-out infinite}
.gs.cig .kof{animation:sizzle .22s linear infinite}
.gs .cember{position:absolute;left:50%;top:50%;width:15.4cqw;height:15.4cqw;margin:-7.7cqw 0 0 -7.7cqw;border-radius:50%;z-index:1;background:conic-gradient(#ffcf4a calc(var(--pis,0)*1turn),rgba(0,0,0,.45) 0);-webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%)}
.gs.hazir{box-shadow:inset 0 0 0 .6cqw #0d0e10,0 0 0 .9cqw var(--gold),inset 0 -2cqw 3cqw rgba(255,150,30,.5);animation:pulse .6s ease-in-out infinite}
.gs .duman{position:absolute;top:-2cqw;width:7cqw;height:7cqw;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);filter:blur(.6cqw);animation:smoke 1.6s ease-out infinite;pointer-events:none;z-index:3}
.gs .duman.d1{left:5%}.gs .duman.d2{left:38%;animation-delay:.55s}.gs .duman.d3{left:68%;animation-delay:1.1s}
.gs .kivilcim{position:absolute;width:1cqw;height:1cqw;border-radius:50%;background:#ffd36b;box-shadow:0 0 1cqw #ff9a1a;z-index:3;animation:kivil .9s ease-out infinite;pointer-events:none}
.gs .kivilcim.k1{left:30%;top:55%}.gs .kivilcim.k2{left:62%;top:45%;animation-delay:.4s}.gs .kivilcim.k3{left:48%;top:65%;animation-delay:.7s}
.gs .parilti{position:absolute;inset:0;z-index:3;pointer-events:none}
.gs .parilti i{position:absolute;width:3cqw;height:3cqw;background:#fff6b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:parilti 1s ease-in-out infinite}
.gs .parilti i:nth-child(1){left:12%;top:14%}.gs .parilti i:nth-child(2){right:12%;top:30%;animation-delay:.35s}.gs .parilti i:nth-child(3){left:40%;bottom:10%;animation-delay:.7s}
.grill.g3{gap:.8cqw;padding:1cqw}
.grill.g3 .gs{min-height:10.6cqw}
.grill.g3 .gs .kof{width:10cqw;height:10cqw}.grill.g3 .gs .sil{width:9.6cqw;height:9.6cqw}
.grill.g3 .gs .cember{width:12.4cqw;height:12.4cqw;margin:-6.2cqw 0 0 -6.2cqw}
.gs:active{transform:translateY(.5cqw) scale(.98)}
.tabak{position:relative;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;border-radius:4cqw;cursor:pointer}
/* kesme tahtası */
.tabak::before{content:"";position:absolute;left:-.4cqw;right:-.4cqw;bottom:.8cqw;height:15cqw;border-radius:3.6cqw;background:linear-gradient(#d9a465,#c08544 60%,#a86e33);border:.6cqw solid #5a3510;box-shadow:0 1cqw 0 rgba(0,0,0,.3),inset 0 .8cqw 0 rgba(255,235,200,.35);pointer-events:none}
.tabak::after{content:"";position:absolute;left:50%;bottom:12.4cqw;width:5cqw;height:1.6cqw;margin-left:-2.5cqw;border-radius:1cqw;background:#5a3510;opacity:.55;pointer-events:none}
.tabak .tno{position:absolute;bottom:-1.6cqw;left:50%;transform:translateX(-50%);z-index:2;font-size:max(10px,2.8cqw);font-weight:800;color:#ffe9c4;background:#5a3510;padding:.2cqw 1.8cqw;border-radius:2cqw;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;white-space:nowrap}
.tabak .tab{position:absolute;left:-.8cqw;right:-.8cqw;bottom:2.4cqw;height:14cqw;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,#fff 0 46%,#e7e3da 47% 62%,#fff 63%);box-shadow:0 1.2cqw 0 rgba(0,0,0,.28),inset 0 0 0 .6cqw #cfc8ba;transition:box-shadow .2s;transform-origin:50% 60%}
.tabak .yig{position:relative;z-index:1;width:26cqw;margin-bottom:7.6cqw;display:flex;justify-content:center;align-items:flex-end;transform-origin:50% 100%}
.tabak.wob .yig{animation:squash .32s ease-out}
.tabak.wob .tab{animation:wob .38s ease-out}
.tabak.tasiniyor .yig{opacity:.18;filter:grayscale(1)}
.tabak.parla .tab{animation:halka .9s ease-in-out infinite}
.cop{position:relative;justify-self:center;width:12.6cqw;height:17cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;border-radius:3.6cqw;background:#e9e4da;border:.8cqw solid var(--ink);box-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.cop .ic{width:9cqw;height:9cqw}
.cop small{font-size:max(10px,2.6cqw);font-weight:800;color:#6a5646;line-height:1}
.cop.hedef{background:#ffe08a;transform:scale(1.1);box-shadow:0 0 0 1cqw rgba(255,194,26,.7),0 1cqw 0 rgba(0,0,0,.3)}
.cop.yut{animation:yut .4s ease-out}
/* ---------- malzeme tepsisi ---------- */
.tray{position:relative;z-index:6;flex:none;background:#3a2412;border-top:1.2cqw solid #1f1208;padding:2.2cqw 2cqw calc(env(safe-area-inset-bottom,0px) + 2.4cqw);display:flex;flex-wrap:wrap;justify-content:center;gap:2cqw 1.6cqw}
/* 15 kutu: 5×3; çok yatık ekranda (yükseklik yetmezse, kutu yine ≥44 px ise) 8+7. fit() karar verir (--kh, .r2) */
.tray.r2{gap:1.6cqw 1.2cqw}.tray.r2 .ing{width:10.6cqw}.tray.r2 .ing .ad{font-size:max(9px,2cqw)}
.ing{position:relative;width:17.6cqw;height:var(--kh,16cqw);border-radius:3.6cqw;background:var(--cream);border:.7cqw solid var(--ink);box-shadow:0 1.1cqw 0 #170d05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;transition:transform .12s,box-shadow .12s,background .15s;touch-action:manipulation}
.ing .im{width:calc(var(--kh,16cqw)*.62);height:calc(var(--kh,16cqw)*.62);display:grid;place-items:center;transition:opacity .15s,transform .15s}
.ing .im>*{width:100%;height:100%;max-width:100%;max-height:100%}
.ing .im img,.ing .im svg{width:100%;height:100%;object-fit:contain}
.ing .ad{font-size:max(10px,2.6cqw);font-weight:800;line-height:1;color:#6a5040;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ing .al{position:absolute;left:50%;top:calc(var(--kh,16cqw)*.08);width:calc(var(--kh,16cqw)*.62);height:calc(var(--kh,16cqw)*.62);transform-origin:50% 60%;margin-left:calc(var(--kh,16cqw)*-.31);pointer-events:none;opacity:0;z-index:3}
.ing .al .im2{width:100%;height:100%}
.ing .al .im2>*,.ing .al img,.ing .al svg{width:100%;height:100%;object-fit:contain}
.ing .gol{position:absolute;left:50%;top:calc(var(--kh,16cqw)*.58);width:9cqw;height:2.4cqw;margin-left:-4.5cqw;border-radius:50%;background:rgba(40,20,5,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:scale(.6)}
.ing.sec{background:#fff8e2;transform:translateY(.8cqw);box-shadow:0 .3cqw 0 #170d05,0 0 0 1cqw var(--gold),inset 0 0 2cqw rgba(255,194,26,.5);border-color:#7a4a00;z-index:4}
.ing.sec .im{opacity:.28;transform:scale(.9)}
.ing.sec .gol{opacity:1;transform:scale(1)}
.ing.sec .al{opacity:1;animation:avucla .26s cubic-bezier(.2,1.5,.4,1) forwards,salin 1.6s ease-in-out .26s infinite}
.ing.sec .al .im2{filter:drop-shadow(0 1.6cqw 1cqw rgba(0,0,0,.4))}
.ing:active:not(.kilit){transform:translateY(.8cqw);box-shadow:0 .3cqw 0 #170d05}
.ing.sec:active{box-shadow:0 .3cqw 0 #170d05,0 0 0 1cqw var(--gold)}
.ing.kilit{background:#6b5a4b;cursor:default}
.ing.kilit .im{filter:brightness(0) opacity(.28)}
.ing.kilit .ad{color:#f3e3cf;display:flex;align-items:center;gap:.4cqw;font-variant-numeric:tabular-nums}
.ing.kilit .ad .ic{width:3.2cqw;height:3.2cqw}
.ing.kilit .im{position:relative}
.ing.yeni-m::before{content:attr(data-yeni);position:absolute;top:-2.2cqw;right:-1.4cqw;background:var(--red);color:#fff;font-size:max(10px,2.6cqw);font-weight:900;padding:.5cqw 1.6cqw;border-radius:2cqw;transform:rotate(8deg);z-index:5;border:.4cqw solid var(--ink)}
.ing .rozet{position:absolute;right:-1.8cqw;top:-1.8cqw;min-width:6.8cqw;height:6.8cqw;padding:0 1.2cqw;border-radius:4cqw;background:var(--red);color:#fff;font-size:3.8cqw;font-weight:900;display:grid;place-items:center;border:.6cqw solid var(--ink);line-height:1;z-index:5}

.damga{position:absolute;left:0;top:0;z-index:25;display:flex;align-items:center;gap:1cqw;padding:1cqw 2.6cqw 1cqw 1.4cqw;border:.9cqw solid #c4160c;border-radius:2.4cqw;background:rgba(255,245,240,.92);color:#c4160c;font-weight:900;font-size:5.6cqw;line-height:1;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;pointer-events:none;animation:damga 1.3s ease-out forwards;box-shadow:0 .8cqw 0 rgba(0,0,0,.2)}

.ipucu{position:absolute;left:0;top:0;z-index:24;display:flex;align-items:center;gap:1.4cqw;background:var(--ink);color:#fff;font-weight:800;font-size:4cqw;line-height:1.1;padding:1.4cqw 3.4cqw 1.4cqw 1.6cqw;border-radius:5cqw;white-space:nowrap;box-shadow:0 1cqw 0 rgba(0,0,0,.25);pointer-events:none;animation:ipuc .25s ease-out}

.el{position:absolute;left:0;top:0;width:12cqw;height:12cqw;z-index:25;pointer-events:none;filter:drop-shadow(0 1cqw .8cqw rgba(0,0,0,.35))}

/* ---------- katmanlar (kartlar) ---------- */
.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:rgba(30,16,8,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:calc(env(safe-area-inset-top,0px) + 4cqw) 6cqw calc(env(safe-area-inset-bottom,0px) + 4cqw);animation:fade .25s;overflow:auto;touch-action:pan-y}

.card{position:relative;z-index:1;width:100%;margin:auto 0;flex:none;background:var(--cream);border:1cqw solid var(--ink);border-radius:7cqw;padding:5.4cqw 5cqw 5cqw;text-align:center;box-shadow:0 2cqw 0 rgba(0,0,0,.4);display:grid;gap:2.8cqw;justify-items:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}

.btn{width:100%;min-height:max(44px,13cqw);display:flex;align-items:center;justify-content:center;gap:2cqw;background:var(--red);color:#fff;font-weight:900;font-size:6cqw;padding:2.6cqw;border-radius:5cqw;border:.8cqw solid var(--ink);box-shadow:0 1.4cqw 0 var(--red-d);line-height:1}

.btns{width:100%;display:grid;gap:3cqw;margin-top:1cqw}

.stars{display:flex;gap:1cqw;align-items:flex-end}
.stars span{width:17cqw;height:17cqw}

.stars span.dolu{animation:dus .5s cubic-bezier(.3,1.5,.5,1) both,yparla 1.6s ease-in-out .6s infinite;animation-delay:var(--g,0s),calc(var(--g,0s) + .5s)}
.tablo{width:100%;display:grid;gap:1.2cqw;font-size:4.4cqw;font-weight:800}

.yuzler span{display:flex;align-items:center;gap:1.2cqw;font-weight:900;font-size:5cqw;background:#fff;border:.5cqw solid #e2d3b8;border-radius:4cqw;padding:1cqw 2.6cqw 1cqw 1.2cqw}
