<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ses Denemesi</title>
<style>
/* Burger Ustası ses deneme sayfası (9. tur: gerçek kayıtlar, www/ses/). Her ses için düğme, perde, döngüler, müzik ve yoğunluk katmanı. */
:root{--bg:#fff4dc;--fg:#2a1a10;--line:#e2cfa6;--btn:#ffd36b;--btn2:#f6e6c4;--ok:#3cc45a}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
h1{margin:0 0 4px;font-size:22px}h2{font-size:16px;margin:18px 0 8px}
p{margin:0 0 12px;font-size:13px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
button{min-height:44px;border:2px solid var(--fg);border-radius:10px;background:var(--btn);color:var(--fg);font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:4px 8px}
button:active{transform:translateY(2px)}button.alt{background:var(--btn2)}button.on{background:var(--ok);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{display:flex;gap:6px;align-items:center;min-height:44px;font-weight:700}
#durum{font-size:13px;font-variant-numeric:tabular-nums;white-space:pre-wrap}
</style></head><body>
<h1>Burger Ustası: sesler</h1>
<p>Gerçek kayıtlar (www/ses/, lisanslar www/ses/LISANS.md). İlk dokunuşta ses açılır ve dosyalar yüklenir. Her çalışta perde ±%5 ve ses ±1,5 dB oynar.</p>
<div class="bar">
  <button id="mzM" class="alt">Müzik: menü</button><button id="mzO" class="alt">Müzik: oyun</button><button id="yog" class="alt">Yoğun (3 müşteri)</button>
  <button id="mzK" class="alt">Müzik kapat</button>
  <label>Perde (yarım ton) <input type="range" id="perde" min="-7" max="12" value="0"><b id="pv">0</b></label>
</div>
<h2>Döngüler</h2>
<div class="bar"><button id="dC" class="alt">Izgara cızırtısı</button><button id="dF" class="alt">Fritöz</button>
  <button id="gam" class="alt">Doğrama gamı (10)</button><button id="seri" class="alt">Kasa serisi (1…8)</button></div>
<h2>Efektler</h2>
<div class="grid" id="grid"></div>
<h2>Durum</h2><div id="durum"></div>
<script>window.BU_SES_KOK='../www/ses/';</script>
<script src="../www/js/ses.js"></script>
<script>
var S=BU.SES,$=function(i){return document.getElementById(i)},yog=false,dc=0,df=0;
document.addEventListener('pointerdown',function(){S.ac();S.ayar({efekt:true,muzik:true})},{capture:true});
S.ADLAR.forEach(function(ad){if(S.LISTE.sesler[ad].dongu)return;var b=document.createElement('button');b.textContent=ad;b.onclick=function(){S.cal(ad,{perde:+$('perde').value})};$('grid').appendChild(b)});
$('perde').oninput=function(){$('pv').textContent=this.value};
$('mzM').onclick=function(){S.muzikMod('menu');S.muzik(true)};$('mzO').onclick=function(){S.muzikMod('oyun');S.muzik(true)};
$('mzK').onclick=function(){S.muzik(false)};$('yog').onclick=function(){yog=!yog;S.yogun(yog);this.classList.toggle('on',yog)};
$('dC').onclick=function(){dc=dc?0:1;S.dongu('cizirti',dc);this.classList.toggle('on',!!dc)};
$('dF').onclick=function(){df=df?0:1;S.dongu('fritoz',df);this.classList.toggle('on',!!df)};
var GAM=[0,2,4,5,7,9,11,12,14,16];
$('gam').onclick=function(){GAM.forEach(function(g,i){setTimeout(function(){S.cal('bicak',{perde:g-4,ust:true});if(i===9)setTimeout(function(){S.cal('tamam',{perde:3})},90)},i*220)})};
$('seri').onclick=function(){for(var i=0;i<8;i++)(function(i){setTimeout(function(){S.cal('kasa',{perde:Math.min(7,i),ust:true})},i*600)})(i)};
setInterval(function(){$('durum').textContent=JSON.stringify(S.durum(),null,1)},500);
</script>
</body></html>
