<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>trash test</title>
<style>
:root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #cdd7dc; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#boot { position: fixed; inset: 0; background: #cdd7dc; transition: opacity .35s; }
#boot.off { opacity: 0; pointer-events: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Real main.js / config.js / bus.js / trash.js; fake world (test/trash/fake-world.js); every other module is main's stub.
     Use with ?debug&nosave&manual: window.__tsCtx = ctx, frames advance only through ctx.step(). -->
<script type="module">
import * as config from '../../www/js/config.js';
import * as bus from '../../www/js/bus.js';
import * as trash from '../../www/js/trash.js';
import * as world from './fake-world.js';
window.__TS_MODS = { config, bus, trash, world };
window.__trashMod = trash;
await import('../../www/js/main.js');
</script>
</body>
</html>
